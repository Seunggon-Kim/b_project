<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선수 분석 - C - Baseball Research Center</title>
    <meta name="description" content="KBO 선수 검색 및 상세 분석">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <!-- Favicon (다이아몬드) -->
    <link rel="icon" href="../assets/favicon/diamond.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/diamond.svg">
    <link rel="apple-touch-icon" href="../assets/favicon/diamond-180.png">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/theme-toggle.js"></script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="../" class="logo">
                <img src="../assets/favicon/diamond.svg" alt="" class="logo-icon" width="26" height="26">
                <span>C - Baseball Research Center</span>
            </a>
            <nav class="nav">
                <a href="../" class="nav-link">홈</a>
                <a href="team-stats.html" class="nav-link">팀 통계</a>
                <a href="player-stats.html" class="nav-link">선수 통계</a>
                <a href="player-analytics.html" class="nav-link active">선수 분석</a>
                <a href="factor-stats.html" class="nav-link">요인 통계</a>
                <a href="database-explorer.html" class="nav-link">데이터 탐색</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <h1 class="fade-in"><span class="material-symbols-outlined">person_search</span> 선수 분석</h1>
        <p class="text-secondary mb-3">선수 이름을 검색하여 상세 정보와 성적을 확인하세요</p>

        <!-- Search Section -->
        <section class="mb-3">
            <div class="card">
                <div class="card-body">
                    <div class="search-box">
                        <span class="material-symbols-outlined search-icon">search</span>
                        <input type="text" id="player-search" class="input" placeholder="선수 이름을 입력하세요 (예: 김현수)"
                            autocomplete="off">
                    </div>

                    <!-- Search Results -->
                    <div id="search-results" class="mt-2"></div>
                </div>
            </div>
        </section>

        <!-- Player Info Section -->
        <section id="player-info-section" class="hidden">
            <!-- Player Header Banner -->
            <div id="player-header-bar" class="player-header-bar fade-in">
                <!-- Filled dynamically -->
            </div>

            <!-- Player Details Grid (Profile + Stats + News) -->
            <div class="player-details-grid fade-in">
                <!-- Player Card -->
                <div id="player-card"></div>

                <!-- Stats Card -->
                <div class="stats-card">
                    <h3 class="card-title mb-2">시즌별 성적</h3>
                    <div id="player-stats"></div>
                </div>

                <!-- News Card -->
                <div class="news-card" id="player-news">
                    <h3 class="card-title mb-2">최신 뉴스</h3>
                    <div id="news-list" class="news-list">
                        <!-- News items will be loaded here -->
                    </div>
                </div>
                <!-- Standard Stats Table (Pitching) -->
                <div id="detailed-stats-section" class="detailed-stats-container fade-in hidden">
                    <h3 class="card-title mb-3" id="detailed-stats-title">Standard</h3>
                    <div id="detailed-stats-content"></div>
                </div>

                <!-- Advanced Stats Table (Pitching) -->
                <div id="advanced-stats-section" class="detailed-stats-container fade-in hidden">
                    <h3 class="card-title mb-3">Advanced</h3>
                    <div id="advanced-stats-content"></div>
                </div>

                <!-- Pitch Arsenal Grid (Pitching) -->
                <div id="pitch-arsenal-section" class="detailed-stats-container fade-in hidden">
                    <div class="section-header-flex">
                        <h3 class="card-title mb-0">Pitch Arsenal</h3>
                        <div class="flex-group gap-3">
                            <div class="view-mode-selector">
                                <button id="mode-contour" class="mode-btn active"
                                    onclick="setPitchViewMode('contour')">Contour</button>
                                <button id="mode-point" class="mode-btn"
                                    onclick="setPitchViewMode('point')">Point</button>
                            </div>
                            <div class="view-mode-selector">
                                <button id="persp-catcher" class="mode-btn active"
                                    onclick="setPitchPerspective('catcher')">Catcher</button>
                                <button id="persp-pitcher" class="mode-btn"
                                    onclick="setPitchPerspective('pitcher')">Pitcher</button>
                            </div>
                        </div>
                    </div>
                    <div id="pitch-arsenal-grid" class="pitch-arsenal-grid">
                        <!-- Pitch charts will be loaded here -->
                    </div>
                </div>

                <!-- Usage & Movement Row -->
                <div id="usage-movement-row" class="grid-usage-movement mt-3 hidden">
                    <!-- Pitch Usage Section (For Pitchers) -->
                    <div id="pitch-usage-section" class="detailed-stats-container fade-in">
                        <h3 class="card-title mb-4">Pitch Usage</h3>
                        <div class="usage-container">
                            <div class="usage-header">
                                <div class="usage-label-l">vs. LHH</div>
                                <div class="usage-label-p">Pitch</div>
                                <div class="usage-label-r">vs. RHH</div>
                            </div>
                            <div id="usage-list" class="usage-list">
                                <!-- Filled dynamically -->
                            </div>
                        </div>
                    </div>

                    <!-- Movement Profile Section -->
                    <div id="movement-profile-section" class="detailed-stats-container fade-in">
                        <h3 class="card-title mb-4">Movement Profile (Induced Break)</h3>
                        <div class="movement-container">
                            <canvas id="movement-canvas"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>

        // ===== Theme-aware chart helpers =====
        function getThemeColors() {
            const cs = getComputedStyle(document.documentElement);
            return {
                bg: cs.getPropertyValue('--plot-bg').trim() || '#fff',
                grid: cs.getPropertyValue('--plot-grid').trim() || 'rgba(0,0,0,0.06)',
                axes: cs.getPropertyValue('--plot-axes').trim() || 'rgba(0,0,0,0.3)',
                label: cs.getPropertyValue('--plot-label').trim() || 'rgba(0,0,0,0.5)',
                stroke: cs.getPropertyValue('--plot-stroke').trim() || 'rgba(0,0,0,0.5)',
                pointStroke: cs.getPropertyValue('--plot-point-stroke').trim() || 'rgba(0,0,0,0.4)',
                isDark: document.documentElement.getAttribute('data-theme') === 'dark',
            };
        }
        // Re-render charts when theme changes
        new MutationObserver(() => {
            if (typeof lastArsenalData !== 'undefined' && lastArsenalData) {
                renderMovementProfile(lastArsenalData);
                // arsenal sub-charts
                const types = [...new Set(lastArsenalData.map(p => p.pitch_type))];
                types.forEach(t => {
                    const id = `canvas-${t.replace(/\s+/g, '-')}`;
                    const subset = lastArsenalData.filter(p => p.pitch_type === t);
                    if (typeof renderArsenalChart === 'function') renderArsenalChart(id, subset);
                });
            }
        }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

        let searchTimeout;
        let currentPlayer = null;
        let currentPitchViewMode = 'contour';
        let currentPitchPerspective = 'catcher';
        let lastArsenalData = [];

        // Search input handler
        document.getElementById('player-search').addEventListener('input', (e) => {
            const query = e.target.value.trim();

            clearTimeout(searchTimeout);

            if (query.length < 1) {
                document.getElementById('search-results').innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(() => searchPlayers(query), 300);
        });

        // Search players
        async function searchPlayers(query) {
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = createLoadingSpinner();

            try {
                const data = await API.searchPlayers(query);

                if (data.players.length === 0) {
                    resultsDiv.innerHTML = `<p class="text-muted mt-2">검색 결과가 없습니다.</p>`;
                    return;
                }

                const resultsHTML = `
                    <div style="margin-top: 1rem;">
                        <p class="text-muted mb-1">${data.players.length}명의 선수가 검색되었습니다</p>
                        <div class="grid grid-2" style="gap: 0.5rem;">
                            ${data.players.map(player => `
                                <button 
                                    class="btn btn-secondary" 
                                    onclick="loadPlayerInfo('${player.player_id}')"
                                    style="text-align: left; justify-content: flex-start;"
                                >
                                    ${player.player_name} (${player.team_id}) - No.${(player.back_number !== null && player.back_number !== undefined) ? player.back_number : '?'} ${player.position}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                resultsDiv.innerHTML = resultsHTML;
            } catch (error) {
                resultsDiv.innerHTML = createErrorMessage('검색 중 오류가 발생했습니다.');
            }
        }

        // Load player info
        async function loadPlayerInfo(playerId) {
            const section = document.getElementById('player-info-section');
            const cardDiv = document.getElementById('player-card');
            const newsDiv = document.getElementById('news-list');
            const statsDiv = document.getElementById('player-stats');
            const headerBar = document.getElementById('player-header-bar');

            section.classList.remove('hidden');
            headerBar.innerHTML = '';
            cardDiv.innerHTML = createLoadingSpinner();
            newsDiv.innerHTML = createLoadingSpinner();
            statsDiv.innerHTML = createLoadingSpinner();

            try {
                // Fetch player info and news in parallel
                const [player, newsData] = await Promise.all([
                    API.getPlayerInfo(playerId),
                    API.getPlayerNews(playerId)
                ]);

                currentPlayer = player;

                // Header Banner Bar
                const imageUrl = player.image_url || 'https://via.placeholder.com/150x187?text=No+Image';
                const backNum = (player.back_number !== null && player.back_number !== undefined) ? player.back_number : '?';

                // 정확한 나이 계산 (YYYYMMDD 형식 대응)
                let age = '-';
                if (player.birthday) {
                    const bStr = player.birthday.toString();
                    const bYear = parseInt(bStr.substring(0, 4));
                    const bMonth = parseInt(bStr.substring(4, 6)) - 1; // 0-indexed
                    const bDay = parseInt(bStr.substring(6, 8));

                    const today = new Date();
                    const birth = new Date(bYear, bMonth, bDay);

                    age = today.getFullYear() - birth.getFullYear();
                    const monthDiff = today.getMonth() - birth.getMonth();
                    if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
                        age--;
                    }
                }

                headerBar.innerHTML = `
                    <div class="header-bar-photo">
                        <img src="${imageUrl}" alt="${player.player_name}" 
                             onerror="this.src='https://via.placeholder.com/150x187?text=No+Image'">
                    </div>
                    <div class="header-bar-main">
                        <div class="header-bar-name">
                            <span class="header-bar-number">No.${backNum}</span>
                            ${player.player_name}
                        </div>
                        <div class="header-bar-team">${player.team_name || player.team_id || '-'}</div>
                    </div>
                    <div class="header-bar-info-group">
                        <div class="header-bar-details">
                            <span>나이: ${age}세</span>
                            <span class="header-bar-divider">|</span>
                            <span>${formatThrowBat(player.throw, player.bat)}</span>
                            <span class="header-bar-divider">|</span>
                            <span>${player.height ? player.height + 'cm' : '-'} / ${player.weight ? player.weight + 'kg' : '-'}</span>
                        </div>
                        <div class="header-bar-dob">
                            생년월일: ${formatBirthday(player.birthday)}
                        </div>
                    </div>
                    <div class="header-bar-position">${player.position || '-'}</div>
                `;

                // Player Card (배너 중복 정보 제외)
                cardDiv.innerHTML = `
                    <div class="player-card fade-in">
                        <h3 class="card-title mb-2">상세 프로필</h3>
                        <div class="player-info-vertical">
                            <div class="info-item">
                                <span class="info-label">연봉</span>
                                <span class="info-value">${formatMoney(player.salary)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">입단 계약금</span>
                                <span class="info-value">${formatMoney(player.signing_bonus)}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">입단년도 / 지명순위</span>
                                <span class="info-value">${(player.draft_year || '') + (player.draft_year && player.draft_order ? ' / ' : '') + (player.draft_order || '') || '-'}</span>
                            </div>
                            <div class="info-item">
                                <span class="info-label">경력</span>
                                <span class="info-value">${player.career || '-'}</span>
                            </div>
                        </div>
                    </div>
                `;

                // News UI
                if (newsData.news && newsData.news.length > 0) {
                    newsDiv.innerHTML = newsData.news.map(item => `
                        <a href="${item.link}" target="_blank" class="news-item">
                            ${item.thumb ? `<img src="${item.thumb}" class="news-thumb" alt="thumbnail">` : ''}
                            <div class="news-content">
                                <div class="news-title">${item.title}</div>
                                <div class="news-meta">${item.press}</div>
                            </div>
                        </a>
                    `).join('');
                } else {
                    newsDiv.innerHTML = '<p class="text-muted p-2">최신 뉴스가 없습니다.</p>';
                }

                // Stats Table
                const isPitcher = player.position === '투수';

                // Prepare recent 3 seasons data (2023, 2024, 2025)
                const targetSeasons = [2023, 2024, 2025];

                if (isPitcher) {
                    // Pitcher stats - transposed table
                    const metrics = [
                        { label: 'W', key: 'wins' },
                        { label: 'L', key: 'losses' },
                        { label: 'ERA', key: 'earned_run_average', format: formatERA },
                        { label: 'G', key: 'games' },
                        { label: 'GS', key: 'games_started' },
                        { label: 'SV', key: 'save' },
                        { label: 'IP', key: 'innings_pitched', format: formatIP },
                        { label: 'SO', key: 'strikeout' },
                        { label: 'WHIP', key: 'whip', format: formatERA }
                    ];

                    // Create season data map
                    const seasonDataMap = {};
                    if (player.pitcher_seasons) {
                        player.pitcher_seasons.forEach(s => {
                            if (targetSeasons.includes(s.season)) {
                                seasonDataMap[s.season] = s;
                            }
                        });
                    }

                    // Build transposed table
                    const headers = ['지표', ...targetSeasons.map(y => `${y}`)];
                    const rows = metrics.map(metric => {
                        const row = [metric.label];
                        targetSeasons.forEach(season => {
                            const seasonData = seasonDataMap[season];
                            if (seasonData && seasonData[metric.key] !== null && seasonData[metric.key] !== undefined) {
                                const value = metric.format ? metric.format(seasonData[metric.key]) : seasonData[metric.key];
                                row.push(value);
                            } else {
                                row.push('-');
                            }
                        });
                        return row;
                    });

                    statsDiv.innerHTML = createTable(headers, rows);
                } else {
                    // Batter stats - transposed table
                    const metrics = [
                        { label: 'PA', key: 'plate_appearance' },
                        { label: 'AB', key: 'at_bat' },
                        { label: 'R', key: 'run' },
                        { label: 'H', key: 'hits' },
                        { label: 'HR', key: 'home_run' },
                        { label: 'AVG', key: 'batting_average', format: formatAverage },
                        { label: 'OBP', key: 'on_base_percentage', format: formatAverage },
                        { label: 'SLG', key: 'slugging_percentage', format: formatAverage },
                        { label: 'OPS', key: 'ops', format: formatAverage }
                    ];

                    // Create season data map
                    const seasonDataMap = {};
                    if (player.batter_seasons) {
                        player.batter_seasons.forEach(s => {
                            if (targetSeasons.includes(s.season)) {
                                seasonDataMap[s.season] = s;
                            }
                        });
                    }

                    // Build transposed table
                    const headers = ['지표', ...targetSeasons.map(y => `${y}`)];
                    const rows = metrics.map(metric => {
                        const row = [metric.label];
                        targetSeasons.forEach(season => {
                            const seasonData = seasonDataMap[season];
                            if (seasonData && seasonData[metric.key] !== null && seasonData[metric.key] !== undefined) {
                                const value = metric.format ? metric.format(seasonData[metric.key]) : seasonData[metric.key];
                                row.push(value);
                            } else {
                                row.push('-');
                            }
                        });
                        return row;
                    });

                    statsDiv.innerHTML = createTable(headers, rows);
                }

                // Detailed Stats Section (Pitching)
                const detailedSection = document.getElementById('detailed-stats-section');
                const detailedContent = document.getElementById('detailed-stats-content');

                if (isPitcher && player.pitcher_seasons && player.pitcher_seasons.length > 0) {
                    detailedSection.classList.remove('hidden');

                    // User Requested Header mapping (Season, Team, Age, Pitchs, W, L, ERA, G, GS, QS, CG, ShO, SV, HLD, BS, IP, TBF, H, R, ER, HR, BB, IBB, HBP, WP, BK, SO)
                    const detailedHeaders = [
                        'Season', 'Team', 'Age', 'Pitchs', 'W', 'L', 'ERA', 'G', 'GS', 'QS', 'CG', 'ShO', 'SV', 'HLD', 'BS', 'IP', 'TBF', 'H', 'R', 'ER', 'HR', 'BB', 'IBB', 'HBP', 'WP', 'BK', 'SO'
                    ];

                    const detailedMapping = [
                        { key: 'season' },
                        { key: 'player_team' },
                        { key: 'age' },
                        { key: 'number_of_pitchers' },
                        { key: 'wins' },
                        { key: 'losses' },
                        { key: 'earned_run_average', format: formatERA },
                        { key: 'games' },
                        { key: 'games_started' },
                        { key: 'quality_start' },
                        { key: 'complete_game' },
                        { key: 'shutout' },
                        { key: 'save' },
                        { key: 'hold' },
                        { key: 'blown_save' },
                        { key: 'innings_pitched' },
                        { key: 'total_batters_faced' },
                        { key: 'hits' },
                        { key: 'run' },
                        { key: 'earned_run' },
                        { key: 'home_run' },
                        { key: 'base_on_balls' },
                        { key: 'intentional_base_on_balls' },
                        { key: 'hit_by_pitch' },
                        { key: 'wild_pitch' },
                        { key: 'balk' },
                        { key: 'strikeout' }
                    ];

                    const detailedTableRows = player.pitcher_seasons.map(s => {
                        return detailedMapping.map(m => {
                            if (m.key === 'age') {
                                if (player.birthday) {
                                    const bYear = parseInt(player.birthday.toString().substring(0, 4));
                                    return s.season - bYear;
                                }
                                return '-';
                            }
                            let val = s[m.key];
                            if (val === null || val === undefined) return '-';
                            return m.format ? m.format(val) : val;
                        });
                    });

                    detailedContent.innerHTML = createTable(detailedHeaders, detailedTableRows);

                    // --- Advanced Stats Section (Pitching) ---
                    console.log("Loading Advanced stats for pitcher:", playerId);
                    const advancedSection = document.getElementById('advanced-stats-section');
                    const advancedContent = document.getElementById('advanced-stats-content');

                    const advancedHeaders = [
                        'Season', 'Team', 'Age', 'K/9', 'BB/9', 'K/BB', 'HR/9', 'K%', 'BB%', 'K-BB%', 'AVG', 'OBP', 'SLG', 'WHIP', 'BABIP'
                    ];

                    // Helper to convert IP string ("12 1/3") to decimal
                    const ipToDecimal = (ipStr) => {
                        if (!ipStr) return 0;
                        const s = ipStr.toString();
                        if (s.includes('/')) {
                            const parts = s.split(' ');
                            if (parts.length === 2) {
                                const base = parseFloat(parts[0]);
                                const frac = parts[1] === '1/3' ? 0.333 : (parts[1] === '2/3' ? 0.666 : 0);
                                return base + frac;
                            } else if (s.includes('1/3')) return 0.333;
                            else if (s.includes('2/3')) return 0.666;
                        }
                        return parseFloat(s) || 0;
                    };

                    const advancedTableRows = player.pitcher_seasons.map(s => {
                        const tbf = s.total_batters_faced || 0;
                        const so = s.strikeout || 0;
                        const bb = s.base_on_balls || 0;
                        const hr = s.home_run || 0;
                        const ipDec = ipToDecimal(s.innings_pitched);

                        // Derived metrics
                        const kPct = tbf > 0 ? (so / tbf * 100).toFixed(1) + '%' : '-';
                        const bbPct = tbf > 0 ? (bb / tbf * 100).toFixed(1) + '%' : '-';
                        const kMinusBB = tbf > 0 ? (so / tbf * 100 - bb / tbf * 100).toFixed(1) + '%' : '-';
                        const hr9 = ipDec > 0 ? ((hr * 9) / ipDec).toFixed(2) : '-';

                        // Calculate Age
                        let age = '-';
                        if (player.birthday) {
                            age = s.season - parseInt(player.birthday.toString().substring(0, 4));
                        }

                        return [
                            s.season,
                            s.player_team || '-',
                            age,
                            formatERA(s.k_9),
                            formatERA(s.bb_9),
                            s.k_bb || '-',
                            hr9,
                            kPct,
                            bbPct,
                            kMinusBB,
                            formatAverage(s.batting_average),
                            formatAverage(s.on_base_percentage),
                            formatAverage(s.slugging_percentage),
                            formatERA(s.whip || s.walks_plus_hits_per_inning_pitched),
                            formatAverage(s.babip || s.batting_average_on_balls_in_play)
                        ];
                    });

                    advancedSection.classList.remove('hidden');
                    advancedContent.innerHTML = createTable(advancedHeaders, advancedTableRows);

                    // --- Pitch Arsenal Section (Pitching) ---
                    console.log("Fetching Arsenal data...");
                    const arsenalSection = document.getElementById('pitch-arsenal-section');
                    const arsenalGrid = document.getElementById('pitch-arsenal-grid');

                    try {
                        const arsenalRes = await API.getPitchArsenal(playerId);
                        const arsenalData = arsenalRes.arsenal || [];
                        lastArsenalData = arsenalData; // Store for mode switching
                        console.log("Arsenal total count:", arsenalData.length);

                        if (arsenalData.length > 0) {
                            renderPitchArsenalGrid();
                            renderPitchUsage(playerId);
                            renderMovementProfile(lastArsenalData);
                        } else {
                            console.log("No pitch arsenal data found for player.");
                            arsenalSection.classList.add('hidden');
                            renderPitchUsage(playerId);
                        }

                    } catch (err) {
                        console.error("Error loading arsenal data:", err);
                        arsenalSection.classList.add('hidden');
                    }

                } else {
                    detailedSection.classList.add('hidden');
                    document.getElementById('advanced-stats-section').classList.add('hidden');
                    document.getElementById('pitch-arsenal-section').classList.add('hidden');
                    document.getElementById('usage-movement-row').classList.add('hidden');
                }

                // Scroll to stats
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Apply Team Theme Colors (For both Batters and Pitchers)
                applyTeamTheme(player.team_name || player.team_id);

            } catch (error) {
                console.error("Critical error in loadPlayerInfo:", error);
                cardDiv.innerHTML = createErrorMessage('선수 정보를 불러오는데 실패했습니다.');
                statsDiv.innerHTML = '';
            }
        }

        function setPitchViewMode(mode) {
            currentPitchViewMode = mode;
            document.querySelectorAll('#pitch-arsenal-section .view-mode-selector:first-child .mode-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`mode-${mode}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderPitchArsenalGrid();
        }

        function setPitchPerspective(persp) {
            currentPitchPerspective = persp;
            document.querySelectorAll('#pitch-arsenal-section .view-mode-selector:last-child .mode-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`persp-${persp}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderPitchArsenalGrid();
        }

        function renderPitchArsenalGrid() {
            const arsenalGrid = document.getElementById('pitch-arsenal-grid');
            const arsenalSection = document.getElementById('pitch-arsenal-section');
            if (!arsenalGrid || !lastArsenalData || lastArsenalData.length === 0) return;

            arsenalSection.classList.remove('hidden');
            arsenalGrid.innerHTML = '';

            const groups = {};
            lastArsenalData.forEach(p => {
                if (!groups[p.pitch_type]) groups[p.pitch_type] = [];
                groups[p.pitch_type].push(p);
            });

            const sortedTypes = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length);
            const totalPitches = lastArsenalData.length;

            sortedTypes.forEach(type => {
                const pitches = groups[type];
                const percentage = ((pitches.length / totalPitches) * 100).toFixed(1);
                const chartId = `canvas-${type.replace(/\s+/g, '-')}`;

                const item = document.createElement('div');
                item.className = 'pitch-chart-item fade-in';
                item.innerHTML = `
                    <div class="pitch-chart-title">${type} - ${pitches.length}구 (${percentage}%)</div>
                    <div class="pitch-canvas-wrapper">
                        <canvas id="${chartId}" class="pitch-canvas"></canvas>
                    </div>
                `;
                arsenalGrid.appendChild(item);
                renderArsenalChart(chartId, pitches);
            });
        }

        async function renderPitchUsage(playerId) {
            const usageRow = document.getElementById('usage-movement-row');
            const usageList = document.getElementById('usage-list');
            if (!usageRow || !usageList) return;

            try {
                const data = await API.getPitchUsage(playerId);
                if (!data.usage || data.usage.length === 0) {
                    usageRow.classList.add('hidden');
                    return;
                }

                usageRow.classList.remove('hidden');
                usageList.innerHTML = '';

                data.usage.forEach(item => {
                    const row = document.createElement('div');
                    row.className = 'usage-row fade-in';

                    row.innerHTML = `
                        <div class="usage-left">
                            <span class="usage-pct">${item.usage_l}%</span>
                            <div class="usage-bar-total">
                                <div class="usage-bar-fill pitch-${item.abbreviation}" style="width: ${item.usage_l}%"></div>
                            </div>
                        </div>
                        <div class="usage-center">
                            <div class="pitch-abb-circle pitch-${item.abbreviation}">${item.abbreviation}</div>
                            <span class="usage-total-pct">${item.usage_all}%</span>
                        </div>
                        <div class="usage-right">
                            <div class="usage-bar-total">
                                <div class="usage-bar-fill pitch-${item.abbreviation}" style="width: ${item.usage_r}%"></div>
                            </div>
                            <span class="usage-pct">${item.usage_r}%</span>
                        </div>
                    `;
                    usageList.appendChild(row);
                });

            } catch (err) {
                console.error("Error loading usage data:", err);
                usageRow.classList.add('hidden');
            }
        }

        function renderMovementProfile(pitches) {
            const canvas = document.getElementById('movement-canvas');
            if (!canvas || !pitches || pitches.length === 0) return;

            const ctx = canvas.getContext('2d');
            // Fixed size for consistency
            canvas.width = 400;
            canvas.height = 400;
            const W = canvas.width;
            const H = canvas.height;

            const PITCH_COLORS = {
                '너클볼': '#3C44CD', '스위퍼': '#DDB33A', '슬러브': '#93AFD4',
                '싱커': '#FE9D00', '투심': '#FE9D00', '직구': '#D22D49',
                '체인지업': '#1DBE3A', '커브': '#00D1ED', '커터': '#933F2C',
                '포크': '#3BACAC', '스플리터': '#3BACAC', '슬라이더': '#EEE716'
            };

            // Range: -60cm to 60cm
            const minMove = -60, maxMove = 60;
            const inchToCm = 2.54;

            const transformX = (cm) => ((cm - minMove) / (maxMove - minMove)) * W;
            const transformY = (cm) => H - (((cm - minMove) / (maxMove - minMove)) * H);

            // 1. Draw Grid & Axes
            ctx.clearRect(0, 0, W, H);

            // Grid lines
            const _MC = getThemeColors(); ctx.strokeStyle = _MC.grid;
            ctx.lineWidth = 1;
            for (let i = minMove + 20; i < maxMove; i += 20) {
                // Vertical
                ctx.beginPath();
                ctx.moveTo(transformX(i), 0);
                ctx.lineTo(transformX(i), H);
                ctx.stroke();
                // Horizontal
                ctx.beginPath();
                ctx.moveTo(0, transformY(i));
                ctx.lineTo(W, transformY(i));
                ctx.stroke();
            }

            // Central Axes (0,0)
            ctx.strokeStyle = _MC.axes;
            ctx.lineWidth = 1.5;
            // Y-axis (X=0)
            ctx.beginPath();
            ctx.moveTo(transformX(0), 0);
            ctx.lineTo(transformX(0), H);
            ctx.stroke();
            // X-axis (Y=0)
            ctx.beginPath();
            ctx.moveTo(0, transformY(0));
            ctx.lineTo(W, transformY(0));
            ctx.stroke();

            // Labels
            ctx.fillStyle = _MC.label;
            ctx.font = '10px Inter';
            ctx.fillText('-60', 5, transformY(0) - 5);
            ctx.fillText('60', W - 20, transformY(0) - 5);
            ctx.fillText('60', transformX(0) + 5, 15);
            ctx.fillText('-60', transformX(0) + 5, H - 5);

            // 2. Plot Pitches
            pitches.forEach(p => {
                if (p.pfx_x === null || p.pfx_z === null) return;

                // pfx_x in DB is inches. Horizontal movement.
                // pfx_z in DB is inches. Vertical movement.
                const cmX = parseFloat(p.pfx_x) * inchToCm;
                const cmZ = parseFloat(p.pfx_z) * inchToCm;

                ctx.beginPath();
                ctx.arc(transformX(cmX), transformY(cmZ), 3.5, 0, Math.PI * 2);

                const ptype = p.pitch_type;
                const colorKey = ptype === '싱커' ? '투심' : ptype;
                ctx.fillStyle = PITCH_COLORS[colorKey] || '#3b82f6';
                ctx.globalAlpha = 0.6;
                ctx.fill();

                ctx.strokeStyle = _MC.pointStroke;
                ctx.lineWidth = 0.5;
                ctx.globalAlpha = 0.8;
                ctx.stroke();
            });
            ctx.globalAlpha = 1.0;
        }

        function renderArsenalChart(canvasId, pitches) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            canvas.width = 300;
            canvas.height = 360;
            const W = canvas.width;
            const H = canvas.height;

            const PITCH_COLORS = {
                '너클볼': '#3C44CD', '스위퍼': '#DDB33A', '슬러브': '#93AFD4',
                '싱커': '#FE9D00', '투심': '#FE9D00', '직구': '#D22D49',
                '체인지업': '#1DBE3A', '커브': '#00D1ED', '커터': '#933F2C',
                '포크': '#3BACAC', '스플리터': '#3BACAC', '슬라이더': '#EEE716'
            };

            const isPitcherMode = currentPitchPerspective === 'pitcher';

            const L_val = -0.708333, R_val = 0.708333, Bot_val = 1.5, Top_val = 3.5;
            // Add padding to yMin (User Request: 여유 줄 수 있을까?)
            const xMin = -1.5 - 0.7, xMax = 1.5 + 0.7;
            const yMin = -1.8, yMax = 5.0;

            const transformX = (x) => (x - xMin) / (xMax - xMin) * W;
            const transformY = (y) => H - (y - yMin) / (yMax - yMin) * H;

            const pitchType = pitches[0].pitch_type;
            const colorKey = pitchType === '싱커' ? '투심' : pitchType;
            const baseColor = PITCH_COLORS[colorKey] || '#3b82f6';

            // Filter and potentially flip X for Pitcher View
            const validPitches = pitches.map(p => {
                const px = parseFloat(p.px);
                const pz = parseFloat(p.pz);
                return {
                    px: isPitcherMode ? -px : px,
                    pz: pz
                };
            }).filter(p => !isNaN(p.px) && !isNaN(p.pz));

            if (currentPitchViewMode === 'contour' && validPitches.length > 0) {
                const gridSize = 35, sigma = 0.35;
                const gridStepX = (xMax - xMin) / gridSize;
                const gridStepY = (yMax - yMin) / gridSize;
                let grid = [];

                for (let i = 0; i < gridSize; i++) {
                    for (let j = 0; j < gridSize; j++) {
                        const gx = xMin + (i + 0.5) * gridStepX;
                        const gy = yMin + (j + 0.5) * gridStepY;
                        let dens = 0;
                        validPitches.forEach(p => {
                            const dx = gx - p.px, dy = gy - p.pz;
                            dens += Math.exp(-(dx * dx + dy * dy) / (2 * sigma * sigma));
                        });
                        grid.push({ x: gx, y: gy, val: dens });
                    }
                }

                const maxDens = Math.max(...grid.map(g => g.val));
                if (maxDens > 0) {
                    const cellW = (W / gridSize) + 1, cellH = (H / gridSize) + 1;
                    const levels = [0.1, 0.25, 0.4, 0.6, 0.8];
                    levels.forEach((lv, idx) => {
                        ctx.fillStyle = baseColor;
                        ctx.globalAlpha = 0.15 + (idx * 0.15);
                        grid.forEach(g => {
                            if (g.val >= maxDens * lv) {
                                ctx.fillRect(transformX(g.x - gridStepX / 2), transformY(g.y + gridStepY / 2), cellW, cellH);
                            }
                        });
                    });
                    ctx.globalAlpha = 1.0;
                }
            } else if (validPitches.length > 0) {
                validPitches.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(transformX(p.px), transformY(p.pz), 3, 0, Math.PI * 2);
                    ctx.fillStyle = baseColor;
                    ctx.globalAlpha = 0.6;
                    ctx.fill();
                    ctx.strokeStyle = _AC.pointStroke;
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                });
                ctx.globalAlpha = 1.0;
            }

            // --- Draw Overlays (Strike Zone & Plate) on TOP ---
            const _AC = getThemeColors(); ctx.strokeStyle = _AC.stroke;
            ctx.lineWidth = 1.8;
            ctx.setLineDash(_AC.isDark ? [] : [4, 3]);
            // Strike Zone
            ctx.strokeRect(transformX(L_val), transformY(Top_val), transformX(R_val) - transformX(L_val), transformY(Bot_val) - transformY(Top_val));

            // Home Plate
            const offset = 0.1;
            const L_p = L_val + offset, L_m = L_val - offset;
            const R_p = R_val + offset, R_m = R_val - offset, Center = 0;

            // Perspective logic for Plate: y values
            // Original: S_h=0, M_h=-0.6, E_h=-1.0 (Points DOWN)
            const S_h = 0;
            const plateX = [R_m, L_p, L_m, Center, R_p, R_m];

            // Flip plate pointing if Pitcher Mode (User: 홈플레이트도 180도 회전시키면 될 거 같은데)
            let plateY;
            if (isPitcherMode) {
                // Tip at 0, Base at -1.0 (Points UP towards pitcher/camera, grounded at same level)
                plateY = [-1.0, -1.0, -0.4, 0, -0.4, -1.0];
            } else {
                // Base at 0, Tip at -1.0 (Points DOWN towards catcher/camera)
                plateY = [0, 0, -0.6, -1.0, -0.6, 0];
            }

            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.strokeStyle = _AC.stroke;
            ctx.globalAlpha = 0.5;
            ctx.lineWidth = 1.2;
            ctx.moveTo(transformX(plateX[0]), transformY(plateY[0]));
            plateX.forEach((px, i) => ctx.lineTo(transformX(px), transformY(plateY[i])));
            ctx.stroke();
            ctx.globalAlpha = 1.0;
        }

        /**
         * Apply team-specific background colors (bgcolor1)
         */
        function applyTeamTheme(teamName) {
            const TEAM_COLORS = {
                '키움': '#570514',
                '두산': '#1A1748',
                '롯데': '#041E42',
                '삼성': '#074CA1',
                '한화': '#FC4E00',
                'KIA': '#EA0029',
                'LG': '#C30452',
                'SSG': '#CE0E2D',
                'NC': '#315288',
                'KT': '#000000',
                '고양': '#570514',
                '상무': '#EAB146',
                '경찰': '#333336'
            };

            // Find matching color
            let teamColor = '#1e293b'; // dark default — fine for badges // Default color
            for (const [name, color] of Object.entries(TEAM_COLORS)) {
                if (teamName && teamName.includes(name)) {
                    teamColor = color;
                    break;
                }
            }

            const headerBar = document.getElementById('player-header-bar');

            if (headerBar) {
                headerBar.classList.add('theme-applied');
                headerBar.style.setProperty('--team-color', teamColor);
            }
        }

        // Initialize on page load
        function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('id');
            if (playerId) {
                loadPlayerInfo(playerId);
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
