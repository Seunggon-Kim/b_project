<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>선수 분석 - Bstats</title>
    <meta name="description" content="KBO 선수 검색 및 상세 분석">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <!-- Favicon (다이아몬드) -->
    <link rel="icon" href="../assets/favicon/diamond.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/diamond.svg">
    <link rel="apple-touch-icon" href="../assets/favicon/diamond-180.png">

    <!-- Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/player-analytics.css">
    <style>
        /* 검색창은 본문 너비를 그대로 씁니다. */
        .pa-search { width: 100%; }
        .pa-search .input { width: 100%; }
    </style>
    <script src="../js/config.js"></script>
    <script src="../js/theme-toggle.js"></script>
    <script src="../js/nav.js"></script>
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <a href="../" class="logo">
                <img src="../assets/favicon/diamond.svg" alt="" class="logo-icon" width="26" height="26">
                <span>Bstats</span>
            </a>
            <nav class="nav">
                <a href="../" class="nav-link">홈</a>
                <a href="team-stats" class="nav-link">팀 통계</a>
                <a href="player-stats" class="nav-link">선수 통계</a>
                <a href="player-analytics" class="nav-link active">선수 분석</a>
                <a href="article" class="nav-link">아티클</a>
                <a href="factor-stats" class="nav-link">요인 통계</a>
                <a href="database-explorer" class="nav-link">데이터 탐색</a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <h1 class="fade-in">선수 분석</h1>
        <p class="text-secondary mb-3">선수 이름을 검색하여 상세 정보와 성적을 확인하세요</p>

        <!-- Search Section -->
        <!-- 카드 껍데기 없이 검색창만 둡니다. 흰 상자 안에 입력칸 하나만
             들어 있으면 여백이 내용보다 커집니다. -->
        <section class="mb-3">
            <div class="search-box pa-search">
                <span class="material-symbols-outlined search-icon">search</span>
                <input type="text" id="player-search" class="input" placeholder="선수 이름을 입력하세요 (예: 김현수)"
                    autocomplete="off">
            </div>

            <!-- Search Results -->
            <div id="search-results" class="mt-2"></div>
        </section>

        <!-- Player Info Section -->
        <section id="player-info-section" class="hidden">
            <!-- 1군 / 퓨처스 전환입니다. 홈 화면 토글과 같은 모양입니다.
                 1군 기록이 한 번도 없는 선수는 1군 쪽이 꺼집니다. -->
            <div id="player-mode-tabs" class="player-mode-tabs hidden">
                <button type="button" class="leaders-tab active" data-pmode="first">1군</button>
                <button type="button" class="leaders-tab" data-pmode="futures">퓨처스</button>
            </div>

            <!-- Player Header Banner -->
            <div id="player-header-bar" class="player-header-bar pa-hdr fade-in">
                <!-- Filled dynamically -->
            </div>

            <!-- 팬그래프 선수 페이지의 카드 줄입니다. 왼쪽 한눈에 보기(2칸),
                 오른쪽 프로필(1칸). 뉴스 카드는 수집을 안 해서 없습니다. -->
            <div class="player-details-grid fade-in">
                <div class="pa-card pa-card--ql">
                    <div class="pa-card-tabs"><span class="pa-card-tab">한눈에 보기</span></div>
                    <div class="pa-card-body" id="player-stats"></div>
                </div>

                <div class="pa-card pa-card--profile">
                    <div class="pa-card-tabs"><span class="pa-card-tab">프로필</span></div>
                    <div class="pa-card-body" id="player-card"></div>
                </div>

                <!-- Savant 식 무브먼트 카드입니다. 1군 투수만 켭니다(setupMovementCard). -->
                <div class="pa-card pa-card--move hidden" id="pa-move-card">
                    <div class="pa-card-tabs">
                        <span class="pa-card-tabs-left">
                            <span class="pa-card-tab">무브먼트<span class="pa-hide-sm"> (Induced Break)</span></span>
                            <button type="button" class="pa-help" id="pa-move-help" aria-label="무브먼트 설명" aria-describedby="pa-move-help-text">?</button>
                            <span id="pa-move-help-text" class="sr-only"></span>
                        </span>
                        <select id="pa-move-season" class="pa-move-season" aria-label="무브먼트 시즌"></select>
                    </div>
                    <div class="pa-mv-view" role="group" aria-label="무브먼트 시점">
                        <button type="button" class="pa-mv-view-btn active" data-view="catcher" aria-pressed="true">포수 시점</button>
                        <button type="button" class="pa-mv-view-btn" data-view="pitcher" aria-pressed="false">투수 시점</button>
                    </div>
                    <div class="pa-card-body" id="pa-move-body"></div>
                </div>

                <!-- 퓨처스 최근 경기입니다. 전체 폭을 씁니다.
                     시즌별 성적 칸에 같이 넣었더니 표가 길어지면서
                     옆의 상세 프로필까지 늘어났습니다(align-items:
                     stretch). 프로필 3줄에 1,600px 짜리 빈 칸이
                     생겼습니다. -->
                <div id="futures-recent-section" class="detailed-stats-container fade-in hidden">
                    <h3 class="card-title mb-3">최근 경기</h3>
                    <div id="futures-recent-content"></div>
                </div>

                <!-- Standard Stats Table (Pitching) -->
                <div id="detailed-stats-section" class="detailed-stats-container fade-in hidden">
                    <h3 class="card-title mb-3" id="detailed-stats-title">Standard</h3>
                    <div id="detailed-stats-content"></div>
                </div>

                <!-- Advanced Stats Table (Pitching) -->
                <div id="advanced-stats-section" class="detailed-stats-container fade-in hidden">
                    <h3 class="card-title mb-3">Advanced</h3>
                    <div id="advanced-stats-content"></div>
                </div>

                <!-- Pitch Arsenal Grid (Pitching) -->
                <div id="pitch-arsenal-section" class="detailed-stats-container fade-in hidden">
                    <div class="section-header-flex">
                        <h3 class="card-title mb-0">Pitch Arsenal</h3>
                        <div class="flex-group gap-3 pa-ars-controls">
                            <select id="pa-arsenal-season" class="pa-move-season" aria-label="투구 분포 시즌"></select>
                            <select id="pa-ars-pick" class="pa-move-season" aria-label="공 고르기"
                                title="카운트는 투수 기준입니다(FanGraphs). 유리한 카운트 0-1·0-2·1-2, 불리한 카운트 1-0·2-0·3-0·2-1·3-1, 같은 카운트 0-0·1-1·2-2. 풀카운트(3-2)는 2스트라이크에만 듭니다."></select>
                            <select id="pa-ars-zone" class="pa-move-season" aria-label="존 고르기"
                                title="존 1~9: 스트라이크 존 3×3(포수 시점, 1이 왼쪽 위). 존 11~14: 존 밖 네 귀퉁이. Heart(한가운데)·Shadow(변두리)·Chase(조금 먼 곳)·Waste(아주 먼 곳): 존 가운데를 0%, 존 끝을 100%로 잴 때 67%·133%·200%가 경계입니다(Tango·Savant). 존 폭은 공 반지름을 더한 20인치입니다."></select>
                            <select id="pa-ars-view" class="pa-move-season" aria-label="보기">
                                <option value="contour">등고선만</option>
                                <option value="both">등고선 + 공</option>
                                <option value="point">공만</option>
                            </select>
                            <div class="view-mode-selector">
                                <button id="persp-catcher" class="mode-btn active"
                                    onclick="setPitchPerspective('catcher')">포수 시점</button>
                                <button id="persp-pitcher" class="mode-btn"
                                    onclick="setPitchPerspective('pitcher')">투수 시점</button>
                            </div>
                        </div>
                    </div>
                    <p id="pa-ars-note" class="pa-ars-note hidden"></p>
                    <div id="pitch-arsenal-grid" class="pitch-arsenal-grid">
                        <!-- Pitch charts will be loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Scripts -->
    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script src="../js/stats/metrics.js"></script>
    <script src="../js/stats/columns.js"></script>
    <script src="../js/player-analytics/quicklook.js"></script>
    <script src="../js/player-analytics/percentile.js"></script>
    <script src="../js/player-analytics/movement.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-array@3/dist/d3-array.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-contour@4/dist/d3-contour.min.js"></script>
    <script src="../js/player-analytics/arsenal.js"></script>
    <script>

        // ===== Theme-aware chart helpers =====
        function getThemeColors() {
            const cs = getComputedStyle(document.documentElement);
            return {
                bg: cs.getPropertyValue('--plot-bg').trim() || '#fff',
                grid: cs.getPropertyValue('--plot-grid').trim() || 'rgba(0,0,0,0.06)',
                axes: cs.getPropertyValue('--plot-axes').trim() || 'rgba(0,0,0,0.3)',
                label: cs.getPropertyValue('--plot-label').trim() || 'rgba(0,0,0,0.5)',
                stroke: cs.getPropertyValue('--plot-stroke').trim() || 'rgba(0,0,0,0.5)',
                pointStroke: cs.getPropertyValue('--plot-point-stroke').trim() || 'rgba(0,0,0,0.4)',
                isDark: document.documentElement.getAttribute('data-theme') === 'dark',
            };
        }
        let searchTimeout;
        let currentPlayer = null;
        let currentPitchViewMode = 'contour';  // contour(등고선만) · both(등고선 + 공) · point(공만)
        let arsPick = '', arsZone = '';        // 공 고르기·존 고르기(Savant 투구 분포 참고)
        let currentPitchPerspective = 'catcher';
        let lastArsenalData = [];

        // 두벌식 영문 오타(예: "gnfkeh")를 한글("후라도")로 복원합니다.
        // 한/영 변환을 깜빡하고 영문으로 입력해도 선수 이름이 검색되도록 합니다.
        function qwertyToHangul(src) {
            const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const JUNG = ['ㅏ','ㅐ','ㅑ','ㅒ','ㅓ','ㅔ','ㅕ','ㅖ','ㅗ','ㅘ','ㅙ','ㅚ','ㅛ','ㅜ','ㅝ','ㅞ','ㅟ','ㅠ','ㅡ','ㅢ','ㅣ'];
            const JONG = ['','ㄱ','ㄲ','ㄳ','ㄴ','ㄵ','ㄶ','ㄷ','ㄹ','ㄺ','ㄻ','ㄼ','ㄽ','ㄾ','ㄿ','ㅀ','ㅁ','ㅂ','ㅄ','ㅅ','ㅆ','ㅇ','ㅈ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
            const MAP = {
                q:'ㅂ', w:'ㅈ', e:'ㄷ', r:'ㄱ', t:'ㅅ', y:'ㅛ', u:'ㅕ', i:'ㅑ', o:'ㅐ', p:'ㅔ',
                a:'ㅁ', s:'ㄴ', d:'ㅇ', f:'ㄹ', g:'ㅎ', h:'ㅗ', j:'ㅓ', k:'ㅏ', l:'ㅣ',
                z:'ㅋ', x:'ㅌ', c:'ㅊ', v:'ㅍ', b:'ㅠ', n:'ㅜ', m:'ㅡ',
                Q:'ㅃ', W:'ㅉ', E:'ㄸ', R:'ㄲ', T:'ㅆ', O:'ㅒ', P:'ㅖ',
                Y:'ㅛ', U:'ㅕ', I:'ㅑ', A:'ㅁ', S:'ㄴ', D:'ㅇ', F:'ㄹ', G:'ㅎ', H:'ㅗ',
                J:'ㅓ', K:'ㅏ', L:'ㅣ', Z:'ㅋ', X:'ㅌ', C:'ㅊ', V:'ㅍ', B:'ㅠ', N:'ㅜ', M:'ㅡ'
            };
            const JUNG_COMBINE = {
                'ㅗ': {'ㅏ':'ㅘ','ㅐ':'ㅙ','ㅣ':'ㅚ'},
                'ㅜ': {'ㅓ':'ㅝ','ㅔ':'ㅞ','ㅣ':'ㅟ'},
                'ㅡ': {'ㅣ':'ㅢ'}
            };
            const JONG_COMBINE = {
                'ㄱ': {'ㅅ':'ㄳ'},
                'ㄴ': {'ㅈ':'ㄵ','ㅎ':'ㄶ'},
                'ㄹ': {'ㄱ':'ㄺ','ㅁ':'ㄻ','ㅂ':'ㄼ','ㅅ':'ㄽ','ㅌ':'ㄾ','ㅍ':'ㄿ','ㅎ':'ㅀ'},
                'ㅂ': {'ㅅ':'ㅄ'}
            };
            const JONG_SPLIT = {
                'ㄳ':['ㄱ','ㅅ'],'ㄵ':['ㄴ','ㅈ'],'ㄶ':['ㄴ','ㅎ'],'ㄺ':['ㄹ','ㄱ'],'ㄻ':['ㄹ','ㅁ'],
                'ㄼ':['ㄹ','ㅂ'],'ㄽ':['ㄹ','ㅅ'],'ㄾ':['ㄹ','ㅌ'],'ㄿ':['ㄹ','ㅍ'],'ㅀ':['ㄹ','ㅎ'],'ㅄ':['ㅂ','ㅅ']
            };
            const CHO_IDX = {}; CHO.forEach((c, i) => CHO_IDX[c] = i);
            const JUNG_IDX = {}; JUNG.forEach((c, i) => JUNG_IDX[c] = i);
            const JONG_IDX = {}; JONG.forEach((c, i) => { if (c) JONG_IDX[c] = i; });
            const isJung = (j) => j in JUNG_IDX;
            const isJongable = (j) => j in JONG_IDX;

            let out = '';
            let cho = null, jung = null, jong = null;

            function compose() {
                if (cho !== null && jung !== null) {
                    const code = 0xAC00 + (CHO_IDX[cho] * 21 + JUNG_IDX[jung]) * 28 + (jong ? JONG_IDX[jong] : 0);
                    return String.fromCharCode(code);
                }
                let s = '';
                if (cho !== null) s += cho;
                if (jung !== null) s += jung;
                if (jong !== null) s += jong;
                return s;
            }
            function flush() {
                if (cho !== null || jung !== null || jong !== null) out += compose();
                cho = jung = jong = null;
            }

            for (const ch of src) {
                const jamo = MAP[ch];
                if (!jamo) { flush(); out += ch; continue; }
                if (isJung(jamo)) {
                    if (jung === null) {
                        jung = jamo;
                    } else if (jong === null && JUNG_COMBINE[jung] && JUNG_COMBINE[jung][jamo]) {
                        jung = JUNG_COMBINE[jung][jamo];
                    } else if (jong !== null) {
                        let moved;
                        if (JONG_SPLIT[jong]) { const sp = JONG_SPLIT[jong]; jong = sp[0]; moved = sp[1]; }
                        else { moved = jong; jong = null; }
                        out += compose();
                        cho = moved; jung = jamo; jong = null;
                    } else {
                        flush(); jung = jamo;
                    }
                } else {
                    if (jung === null) {
                        if (cho === null) cho = jamo;
                        else { flush(); cho = jamo; }
                    } else if (cho === null) {
                        flush(); cho = jamo;
                    } else if (jong === null) {
                        if (isJongable(jamo)) jong = jamo;
                        else { flush(); cho = jamo; }
                    } else if (JONG_COMBINE[jong] && JONG_COMBINE[jong][jamo]) {
                        jong = JONG_COMBINE[jong][jamo];
                    } else {
                        flush(); cho = jamo;
                    }
                }
            }
            flush();
            return out;
        }

        // 검색에 사용할 후보 질의 목록을 만듭니다.
        // 원본 질의에 더해, 영문이 섞여 있으면 한글 변환 후보를 추가합니다.
        function buildSearchQueries(raw) {
            const q = (raw || '').trim();
            const list = [q];
            if (/[A-Za-z]/.test(q)) {
                const ko = qwertyToHangul(q);
                if (ko && ko !== q && !list.includes(ko)) list.push(ko);
            }
            return list;
        }

        // Search input handler
        document.getElementById('player-search').addEventListener('input', (e) => {
            const query = e.target.value.trim();

            clearTimeout(searchTimeout);

            if (query.length < 1) {
                document.getElementById('search-results').innerHTML = '';
                return;
            }

            searchTimeout = setTimeout(() => searchPlayers(query), 300);
        });

        // Search players
        async function searchPlayers(query) {
            const resultsDiv = document.getElementById('search-results');
            resultsDiv.innerHTML = createLoadingSpinner();

            try {
                // 원본 + 영타→한글 변환 후보를 함께 조회해 병합합니다(player_id 기준 중복 제거).
                const queries = buildSearchQueries(query);
                const responses = await Promise.all(
                    queries.map(q => API.searchPlayers(q).catch(() => ({ players: [] })))
                );
                const seen = new Set();
                const players = [];
                responses.forEach(data => {
                    ((data && data.players) ? data.players : []).forEach(player => {
                        if (!seen.has(player.player_id)) {
                            seen.add(player.player_id);
                            players.push(player);
                        }
                    });
                });

                // 우리 표에서 못 찾으면 2군까지 찾아봅니다.
                //
                // `players` 는 1군 공식 기록에서 만든 표라 2군에만 있는
                // 선수가 없습니다. 그 선수들은 이름을 쳐도 "검색 결과가
                // 없습니다" 만 나왔습니다.
                //
                // **빈손일 때만 부릅니다.** 타이핑마다 KBO 를 두드리면
                // 느려집니다. 대부분의 검색은 D1 안에서 끝납니다.
                if (players.length === 0) {
                    const fut = await API.searchFuturesPlayers(query);
                    ((fut && fut.players) ? fut.players : []).forEach(p => {
                        if (!seen.has(p.player_id)) {
                            seen.add(p.player_id);
                            // 등번호가 없으면 계약이 끝난 선수입니다.
                            // is_active 0 이면 화면이 소속과 등번호를
                            // 감춥니다. 'No.?' 로 읽히지 않습니다.
                            players.push({ ...p, is_active: p.registered ? 1 : 0 });
                        }
                    });
                }

                if (players.length === 0) {
                    resultsDiv.innerHTML = `<p class="text-muted mt-2">검색 결과가 없습니다.</p>`;
                    return;
                }

                const resultsHTML = `
                    <div style="margin-top: 1rem;">
                        <p class="text-muted mb-1">${players.length}명의 선수가 검색되었습니다</p>
                        <div class="grid grid-2" style="gap: 0.5rem;">
                            ${players.map(player => `
                                <button 
                                    class="btn btn-secondary" 
                                    onclick="showPlayer('${player.player_id}', ${player.futures ? "'futures'" : 'null'})"
                                    style="text-align: left; justify-content: flex-start;"
                                >
                                    ${player.player_name}${(player.is_active && player.team_id) ? ' (' + player.team_id + ')' : ''}${player.is_active ? (' - No.' + ((player.back_number !== null && player.back_number !== undefined) ? player.back_number : '?') + (player.position ? ' ' + player.position : '')) : (player.position ? ' - ' + player.position : '')}
                                </button>
                            `).join('')}
                        </div>
                    </div>
                `;

                resultsDiv.innerHTML = resultsHTML;
            } catch (error) {
                resultsDiv.innerHTML = createErrorMessage('검색 중 오류가 발생했습니다.');
            }
        }

        /**
         * 1군 등록 배지입니다.
         *
         * `first_team` 은 KBO 등록 현황에서 매일 받은 것입니다. 그 표에
         * 있으면 지금 1군에 있는 것이고, 없으면 **모르는 것**입니다.
         *
         * `is_active`(올 시즌 기록 있음)와 다릅니다. 어제 말소된 선수는
         * is_active 는 1 이지만 1군에는 없습니다.
         *
         * **없을 때 "말소" 라고 쓰면 안 됩니다.** 2군에 있는 것과 우리가
         * 아직 못 받은 것을 구분할 수 없습니다. 은퇴 선수도 마찬가지라
         * 그때는 배지를 아예 안 보여 줍니다.
         */
        function firstTeamBadge(player) {
            const ft = player.first_team;
            if (!ft) return '';
            // 등번호는 배지에 넣지 않습니다. 바로 옆 이름 줄에 이미
            // 'No.29' 가 있어 두 번 나옵니다.
            return `<span class="first-team-badge" title="${ft.as_of} 기준 KBO 1군 등록 현황">`
                + '1군 등록</span>';
        }

        /**
         * 선수 머리 배너입니다.
         *
         * 1군과 퓨처스가 **같은 함수를 씁니다.** 퓨처스 응답은
         * `futuresToPlayer` 가 1군과 같은 모양으로 바꿔 줍니다. 두
         * 벌로 두면 한쪽만 고쳤을 때 조용히 어긋납니다.
         */
        function renderHeaderBar(player) {
            const PHOTO_PLACEHOLDER = '../assets/player_no_image.png';  // KBO 공식 no-Image
            const cdnImg = player.image_url || '';
            const localImg = `../assets/player_photos/${player.player_id}.jpg`;  // 로컬 미러(CDN 404 폴백)
            const imageUrl = cdnImg || localImg;  // CDN 우선, 없으면 로컬
            const backNum = (player.back_number !== null && player.back_number !== undefined) ? player.back_number : '?';

            const Q = window.PlayerAnalytics.quicklook;
            const age = Q.ageParts(player.birthday, new Date());
            const dob = Q.dobText(player.birthday);
            const team = (player.is_active && (player.team_name || player.team_id))
                ? (player.team_name || player.team_id) : '-';

            // 팬그래프 헤더 모양입니다. 이름·팀 / 나이·투타·키몸무게 / 생년월일.
            // 포지션만 오른쪽 끝입니다.
            return `
                    <div class="pa-hdr-photo">
                        <img src="${imageUrl}" alt="${escapeHtml(player.player_name)}" data-local="${localImg}"
                             onerror="var l=this.getAttribute('data-local'); if(l && this.src.indexOf('player_photos')===-1){this.src=l;} else {this.onerror=null; this.src='${PHOTO_PLACEHOLDER}';}">
                    </div>
                    <div class="pa-hdr-info">
                        <div class="pa-hdr-top">
                            <div class="pa-hdr-name">${escapeHtml(player.player_name)}</div>
                            ${player.is_active ? '<span class="pa-hdr-num">No.' + backNum + '</span>' : ''}
                            <span class="pa-hdr-team">${escapeHtml(team)}${firstTeamBadge(player)}</span>
                        </div>
                        <div class="pa-hdr-data">
                            <span>나이: ${age ? age.years + '세' : '-'}</span>
                            <span>투타: ${formatThrowBat(player.throw, player.bat)}</span>
                            <span>${player.height ? player.height + 'cm' : '-'} / ${player.weight ? player.weight + 'kg' : '-'}</span>
                        </div>
                        ${dob ? `<div class="pa-hdr-dob">생년월일: ${dob}${age ? ` <span class="pa-hdr-age">(만 ${age.years}세 ${age.months}개월)</span>` : ''}</div>` : ''}
                    </div>
                    <div class="pa-hdr-pos">${escapeHtml(player.position || '-')}</div>
                `;
        }

        // --- 1군 / 퓨처스 전환 -------------------------------------
        //
        // 홈 화면 토글과 같은 방식입니다. 다른 점은 1군 기록이 한 번도
        // 없는 선수가 있다는 것입니다. 그때는 1군 단추를 끕니다.

        let playerMode = 'first';
        let modePlayerId = null;

        /**
         * 지금 보고 있는 선수를 주소창에 반영합니다.
         *
         * 예전에는 검색으로 선수를 열어도 주소가 그대로였습니다. 그래서
         * 링크를 복사해 보내면 엉뚱한 선수가 열리고, 새로고침하면 검색
         * 화면으로 돌아갔습니다. 실제로 타무라를 보고 있는데 주소창에는
         * 앞서 본 선수(52765)가 남아 있었습니다.
         *
         *     ?id=56218&mode=futures
         *
         * 이미 같은 주소면 아무것도 하지 않습니다. 뒤로 가기로 돌아온
         * 직후에 다시 쌓으면 히스토리가 꼬입니다.
         */
        function syncUrl(playerId, mode) {
            if (!playerId) return;
            const url = new URL(window.location.href);
            url.searchParams.set('id', playerId);
            if (mode === 'futures') {
                url.searchParams.set('mode', 'futures');
            } else {
                url.searchParams.delete('mode');
            }
            if (url.href !== window.location.href) {
                history.pushState({ id: String(playerId), mode: mode || null },
                                  '', url);
            }
        }

        /**
         * 토글 상태를 맞춥니다.
         *
         * `firstTeamEmpty` 가 참이면 1군 단추를 끕니다. 그 선수는 1군
         * 기록이 없어서 보여 줄 것이 없습니다.
         */
        function setPlayerMode(mode, playerId, hasFirstTeam) {
            playerMode = mode;
            modePlayerId = playerId;
            syncUrl(playerId, mode);
            const tabs = document.getElementById('player-mode-tabs');
            if (!tabs) return;
            tabs.classList.remove('hidden');
            tabs.querySelectorAll('.leaders-tab').forEach(btn => {
                const on = btn.dataset.pmode === mode;
                btn.classList.toggle('active', on);
                const dead = btn.dataset.pmode === 'first' && !hasFirstTeam;
                btn.disabled = dead;
                btn.title = dead ? '1군 기록이 없는 선수입니다' : '';
            });
        }

        /**
         * 퓨처스 응답을 1군 `players` 행과 같은 모양으로 바꿉니다.
         *
         * 머리 배너와 프로필 카드를 1군과 같은 코드로 그리려는 것입니다.
         * 값의 단위와 형식은 Worker 가 이미 맞춰서 보냅니다
         * (`throw`/`bat` 은 R/L/S, `birthday` 는 YYYYMMDD, 연봉은 원).
         */
        function futuresToPlayer(f) {
            return {
                player_id: f.player_id,
                player_name: f.name || '-',
                back_number: f.back_number,
                birthday: f.birthday_ymd,
                position: f.position_name,
                throw: f.throw,
                bat: f.bat,
                height: f.height,
                weight: f.weight,
                salary: f.salary_won,
                signing_bonus: null,
                team_name: f.team,
                team_id: f.team_code,
                image_url: f.photo,
                // **등번호가 있어야 지금 그 팀 선수입니다.**
                //
                // KBO 는 등번호 자리로 알려 줍니다. 비어 있으면 계약이
                // 끝난 선수이고, '#' 이면 은퇴입니다. 옛 소속을 그대로
                // 보여 주면 아직 그 팀에 있는 것처럼 읽힙니다.
                //
                // 화면은 is_active 가 0 이면 소속을 '-' 로 쓰고 등번호와
                // 팀 색을 감춥니다. 1군 은퇴 선수와 같은 모양입니다.
                is_active: f.registered ? 1 : 0,
                // 1군 등록 배지는 퓨처스 화면에서 뜻이 없습니다.
                first_team: null,
            };
        }

        /**
         * play_by_play 로 만드는 카드들을 감춥니다.
         *
         * 구종 분석·투구 위치·wOBA 는 타석 단위 자료가 있어야 하는데
         * 퓨처스는 그것이 공개되지 않습니다. 빈 카드를 남기면 자료가
         * 없는 것인지 고장인지 구분되지 않습니다.
         */
        function hidePbpSections() {
            arsToken++;
            ['detailed-stats-section', 'advanced-stats-section',
             'pitch-arsenal-section'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.classList.add('hidden');
            });
        }

        /** 프로필 카드 본문입니다. items = [[라벨, 값], ...] */
        function profileHtml(items) {
            return '<dl class="pa-prof">' + items.map(([k, v]) =>
                `<div class="pa-prof-row"><dt>${escapeHtml(k)}</dt><dd>${escapeHtml(v)}</dd></div>`).join('') + '</dl>';
        }

        /** 프로필 표 맨 앞 줄(헤더와 같은 값)입니다. 1군·퓨처스 공통. */
        function profileBasics(player) {
            const Q = window.PlayerAnalytics.quicklook;
            const age = Q.ageParts(player.birthday, new Date());
            const dob = Q.dobText(player.birthday);
            return [
                ['나이', age ? '만 ' + age.years + '세' : '-'],
                ['투타', formatThrowBat(player.throw, player.bat)],
                ['신체', (player.height || player.weight)
                    ? (player.height ? player.height + 'cm' : '-') + ' / ' + (player.weight ? player.weight + 'kg' : '-') : '-'],
                ['생년월일', dob || '-'],
            ];
        }

        // --- 무브먼트 카드(Savant 참고) ---------------------------------
        // 1군 투수만 보입니다. 연도를 바꾸면 그 시즌 투구를 불러옵니다.
        // 같은 선수·시즌은 다시 부르지 않습니다. 빈 결과(오류 포함)는
        // 저장하지 않아 다음에 다시 시도합니다.
        const mvCache = {};
        const usageCache = {};
        const pvCache = {};
        // 위·아래 카드가 같은 선수·시즌 데이터를 한 번만 부르게 합니다. 진행 중 요청(Promise)도 저장합니다.
        // 빈 결과(오류 포함)는 저장을 지워 다음에 다시 시도합니다.
        const arsenalReq = {};
        const usageReq = {};
        const pvReq = {};
        function sharedFetch(store, key, fetcher, isEmpty) {
            if (store[key]) return store[key];
            const p = Promise.resolve().then(fetcher).then(
                res => { if (isEmpty(res)) delete store[key]; return res; },
                err => { delete store[key]; throw err; });
            store[key] = p;
            return p;
        }
        function getArsenalShared(playerId, season) {
            return sharedFetch(arsenalReq, playerId + ':' + season,
                () => API.getPitchArsenal(playerId, season), r => !r || !(r.arsenal || []).length);
        }
        function getUsageShared(playerId, season) {
            return sharedFetch(usageReq, playerId + ':' + season,
                () => API.getPitchUsage(playerId, season), r => !r || !(r.usage || []).length);
        }
        function getPitchValuesShared(playerId, season) {
            return sharedFetch(pvReq, playerId + ':' + season,
                () => API.getPitchValues(playerId, season), r => !r || !(r.rows || []).length);
        }
        const avgCache = {};  // 시즌별 리그 평균(선수와 무관)
        let mvHand = null;    // 현재 선수의 투구 손('L'/'R')
        let mvToken = 0;
        let mvView = 'catcher';
        let mvLast = null;  // 마지막으로 그린 {pitches, total, ctx}(시점만 바꿀 때 다시 부르지 않음)

        // 툴팁 글자를 시점에 맞춰 바꿉니다(눈에 보이는 툴팁 + 스크린리더용 숨은 글자).
        function setMovementHelp() {
            const M = window.PlayerAnalytics.movement;
            const help = document.getElementById('pa-move-help');
            const text = document.getElementById('pa-move-help-text');
            const tip = M.helpFor(mvView);
            if (help) help.dataset.tip = tip;
            if (text) text.textContent = tip;
        }

        function hideMovementCard() {
            mvToken++;  // 아직 오는 중인 응답을 버립니다.
            mvLast = null;
            const card = document.getElementById('pa-move-card');
            if (card) card.classList.add('hidden');
            const grid = document.querySelector('.player-details-grid');
            if (grid) grid.classList.remove('pa-3col');
        }

        function setupMovementCard(player, playerId) {
            const M = window.PlayerAnalytics.movement;
            mvLast = null;  // 이전 선수 그림이 시점 전환 때 다시 그려지지 않게
            mvHand = player.throw || null;
            setMovementHelp();
            const seasons = player.position === '투수' ? M.seasonsFor(player) : [];
            const totals = M.totalsFor(player);
            if (!seasons.length) { hideMovementCard(); return; }
            // 투수는 시즌 타일 대신 구종 구사율을 둡니다(연도는 무브먼트와 같이 바뀜).
            const profile = document.getElementById('player-card');
            const holder = document.createElement('div');
            holder.className = 'pa-usage';
            holder.id = 'pa-usage';
            const tiles = profile.querySelector('.pa-tiles');
            if (tiles) tiles.replaceWith(holder); else profile.appendChild(holder);
            const select = document.getElementById('pa-move-season');
            select.innerHTML = seasons.map(y => `<option value="${y}">${y}</option>`).join('');
            select.value = String(seasons[0]);
            select.onchange = () => loadMovement(playerId, Number(select.value), totals[Number(select.value)]);
            document.getElementById('pa-move-card').classList.remove('hidden');
            document.querySelector('.player-details-grid').classList.add('pa-3col');
            loadMovement(playerId, seasons[0], totals[seasons[0]]);
        }

        async function loadMovement(playerId, season, total) {
            const M = window.PlayerAnalytics.movement;
            const body = document.getElementById('pa-move-body');
            const usageBox = document.getElementById('pa-usage');
            const token = ++mvToken;
            mvLast = null;  // 새 시즌을 부르는 동안 시점 전환이 이전 시즌을 다시 그리지 않게
            const key = playerId + ':' + season;
            let pitches = mvCache[key];
            let usage = usageCache[key];
            let pv = pvCache[key];
            let avg = avgCache[season];
            if (!pitches || !usage || !pv || !avg) {
                // 데이터가 없는 칸에만 로딩을 보입니다(평균만 없으면 어느 칸도 가리지 않습니다).
                if (!pitches) body.innerHTML = createLoadingSpinner();
                if (!usage && usageBox) usageBox.innerHTML = createLoadingSpinner();
                const [a, u, pvr, av] = await Promise.all([
                    pitches ? null : getArsenalShared(playerId, season),
                    usage ? null : getUsageShared(playerId, season),
                    pv ? null : getPitchValuesShared(playerId, season),
                    avg ? null : API.getMovementAvg(season),
                ]);
                if (!pitches) { pitches = (a && a.arsenal) || []; if (pitches.length) mvCache[key] = pitches; }
                if (!usage) { usage = u || { usage: [] }; if ((usage.usage || []).length) usageCache[key] = usage; }
                // 구종 가치는 비어 있어도(404·2016 이전) 이 페이지 동안 저장합니다. 연도를 바꿀 때마다 다시 부르지 않게.
                if (!pv) { pv = pvr || { rows: [] }; pvCache[key] = pv; }
                if (!avg) { avg = av || { rows: [] }; avgCache[season] = avg; }  // 리그 평균은 비어 있어도 저장합니다(없으면 이 페이지에선 평균 없음)
            }
            if (token !== mvToken) return;  // 그사이 다른 선수·시즌을 골랐습니다.
            const label = M.handLabel(mvHand);
            const ctx = label ? { map: M.avgFor(avg, mvHand), label } : null;
            mvLast = { pitches, total, ctx };
            body.innerHTML = M.bodyHtml(pitches, total, mvView, ctx);
            if (usageBox) usageBox.innerHTML = M.usageHtml(usage, season, pv);
        }

        /**
         * 퓨처스(2군) 화면입니다.
         *
         * KBO 퓨처스 선수 페이지를 Worker 가 그때그때 읽습니다. 시즌별
         * 기록은 없습니다. 올 시즌 요약과 최근 경기만 공개됩니다.
         */
        async function loadFuturesPlayer(playerId, opts) {
            const section = document.getElementById('player-info-section');
            const cardDiv = document.getElementById('player-card');
            const statsDiv = document.getElementById('player-stats');
            const headerBar = document.getElementById('player-header-bar');

            section.classList.remove('hidden');
            headerBar.innerHTML = '';
            cardDiv.innerHTML = createLoadingSpinner();
            statsDiv.innerHTML = createLoadingSpinner();
            hidePbpSections();
            hideMovementCard();

            const f = await API.getFuturesPlayer(playerId);
            if (!f) {
                cardDiv.innerHTML = createErrorMessage('퓨처스 기록을 찾지 못했습니다.');
                statsDiv.innerHTML = '';
                return;
            }

            const player = futuresToPlayer(f);
            currentPlayer = player;
            setPlayerMode('futures', playerId,
                          !(opts && opts.firstTeamEmpty));

            headerBar.innerHTML = renderHeaderBar(player);

            cardDiv.innerHTML = profileHtml([
                ...profileBasics(player),
                ['연봉', formatMoney(player.salary, 'KRW')],
                ['지명순위', f.draft || '-'],
                ['출신교', f.career || '-'],
            ]);

            // 연도별 기록이 있으면 최근 3시즌, 없으면 올 시즌 요약입니다.
            const Q = window.PlayerAnalytics.quicklook;
            const seasons = f.seasons || [];
            const season = f.season || { columns: [], cells: [] };
            const model = seasons.length ? Q.buildFutures(seasons, f.kind)
                : (season.cells.length ? Q.summary(season.columns, season.cells) : null);
            let html = '<div class="futures-stat-head">'
                + '<span class="futures-badge">퓨처스(2군)</span>'
                + '<span class="futures-note">'
                + (seasons.length ? '2010년부터의 기록입니다.' : '올 시즌 기록입니다.')
                + '</span></div>';
            html += model ? Q.tableHtml(model) : '<p class="text-muted mt-2">퓨처스 기록이 없습니다.</p>';
            statsDiv.innerHTML = html;
            // 프로필 아래 최신 퓨처스 시즌 타일입니다. 연도별 기록이 없으면 붙이지 않습니다.
            cardDiv.insertAdjacentHTML('beforeend', Q.tilesHtml(Q.futuresTiles(seasons, f.kind)));

            // 최근 경기는 전체 폭 카드로 뺍니다. 시즌별 성적 칸에 같이
            // 넣으면 표가 길어지면서 옆의 상세 프로필까지 늘어납니다.
            const recent = f.recent || { columns: [], rows: [] };
            const recentSection = document.getElementById('futures-recent-section');
            const recentContent = document.getElementById('futures-recent-content');
            if (recentSection && recentContent) {
                if (recent.rows.length) {
                    recentContent.innerHTML = createTable(recent.columns, recent.rows);
                    recentSection.classList.remove('hidden');
                } else {
                    recentContent.innerHTML = '';
                    recentSection.classList.add('hidden');
                }
            }

            // 등록되지 않은 선수에게 팀 색을 입히면 아직 그 팀에
            // 있는 것처럼 보입니다. 소속 이름은 이미 '-' 인데
            // 배경만 삼성 파랑이면 한 화면에서 두 값이 어긋납니다.
            applyTeamTheme(player.is_active
                ? (player.team_name || player.team_id || null) : null);
        }

        /**
         * 선수 화면 진입점입니다. 모드에 따라 갈립니다.
         *
         * 주소에 `?mode=futures` 가 있으면 바로 퓨처스로 엽니다. 홈
         * 화면 퓨처스 개인 순위에서 넘어올 때 그렇게 옵니다.
         */
        async function showPlayer(playerId, mode) {
            if (mode === 'futures') {
                await loadFuturesPlayer(playerId);
            } else {
                await loadPlayerInfo(playerId);
            }
        }

        // 백분위 색: 시즌별 리그 투수 기록은 페이지 안에서 한 번만 받습니다.
        const pctSeasonCache = new Map();
        let pctToken = 0;
        function getLeaguePitchers(season) {
            if (!pctSeasonCache.has(season)) {
                pctSeasonCache.set(season, API.getPitcherStats(season, 2000, 0)
                    .then(res => (res && res.pitchers) || null)
                    .catch(() => null));
            }
            return pctSeasonCache.get(season);
        }

        // Standard·Advanced 표를 다 그린 뒤에 비동기로 칠합니다. 실패한 시즌은 색 없이 둡니다.
        async function paintPercentileColors(player, token) {
            const P = window.PlayerAnalytics.percentile;
            const tables = ['detailed-stats-content', 'advanced-stats-content']
                .map(id => document.querySelector('#' + id + ' table')).filter(Boolean);
            if (!tables.length) return;
            const seasons = [...new Set(player.pitcher_seasons.map(s => Number(s.season)).filter(Number.isFinite))];
            const pools = new Map();
            let next = 0;
            const worker = async () => {
                while (next < seasons.length) {
                    const season = seasons[next++];
                    const rows = await getLeaguePitchers(season);
                    if (rows) pools.set(season, P.pool(rows));
                }
            };
            await Promise.all([worker(), worker(), worker()]);
            if (token !== pctToken || currentPlayer !== player) return;

            tables.forEach(table => {
                const heads = [...table.querySelectorAll('thead th')].map(th => th.textContent.trim());
                const cols = [];
                heads.forEach((h, i) => { if (P.METRICS[h]) cols.push([h, i]); });
                table.querySelectorAll('tbody tr').forEach(tr => {
                    const tds = tr.children;
                    const season = Number(tds[0] && tds[0].textContent.trim());
                    const team = tds[1] ? tds[1].textContent.trim() : '';
                    const pool = pools.get(season);
                    if (!pool) return;
                    const row = player.pitcher_seasons.find(s => Number(s.season) === season && (s.player_team || '-') === team);
                    if (!row) return;
                    const v = P.rowValues(row);
                    if (!(v.outs >= P.MIN_OUTS)) return;
                    cols.forEach(([h, i]) => {
                        const pct = P.percentile(v[h], pool[h], P.METRICS[h].better);
                        const t = P.tier(pct);
                        if (!t || !tds[i]) return;
                        tds[i].classList.add('pa-pct', 'pa-pct--' + t);
                        tds[i].title = '그해 ' + P.label(pct);
                    });
                });
            });
            // 안내 줄: Advanced 표 아래(없으면 Standard 아래)
            document.querySelectorAll('.pa-pct-note').forEach(n => n.remove());
            const host = document.getElementById('advanced-stats-content');
            const anchor = host && host.querySelector('table') ? host : document.getElementById('detailed-stats-content');
            anchor.insertAdjacentHTML('beforeend', '<p class="pa-pct-note">색: 그해 30이닝 이상 투수 중 상위 10%는 빨강, 하위 10%는 파랑입니다. 5% 안쪽은 더 진합니다.</p>');
        }

        // Load player info
        async function loadPlayerInfo(playerId) {
            pctToken++;
            const section = document.getElementById('player-info-section');
            const cardDiv = document.getElementById('player-card');
            const statsDiv = document.getElementById('player-stats');
            const headerBar = document.getElementById('player-header-bar');

            section.classList.remove('hidden');
            hideMovementCard();
            headerBar.innerHTML = '';
            cardDiv.innerHTML = createLoadingSpinner();
            statsDiv.innerHTML = createLoadingSpinner();
            // 퓨처스에서 넘어왔을 수 있습니다. 1군에는 없는 카드입니다.
            const futuresRecent = document.getElementById('futures-recent-section');
            if (futuresRecent) futuresRecent.classList.add('hidden');

            try {
                const player = await API.getPlayerInfo(playerId);

                // 1군 기록이 한 번도 없는 선수입니다. `players` 표는 1군
                // 공식 기록에서 만들기 때문에 2군에만 있는 선수는 아예
                // 들어 있지 않습니다. 예전에는 화면이 통째로 비었습니다.
                if (!player) {
                    await loadFuturesPlayer(playerId, { firstTeamEmpty: true });
                    return;
                }

                currentPlayer = player;
                setPlayerMode('first', playerId, true);

                // 외국인 선수는 연봉/계약금이 달러, 국내 선수는 원 단위로 저장되어 통화 표기를 구분한다.
                const isForeign = isForeignPlayer(player);

                headerBar.innerHTML = renderHeaderBar(player);

                const money = (v) => formatMoney(v, isForeign ? 'USD' : 'KRW');
                const draft = (player.draft_year || '')
                    + (player.draft_year && player.draft_order ? ' / ' : '')
                    + (player.draft_order || '');
                cardDiv.innerHTML = profileHtml([
                ...profileBasics(player),
                    ['연봉', money(player.salary)],
                    ['입단 계약금', money(player.signing_bonus)],
                    ['입단년도 / 지명순위', draft || '-'],
                    ['경력', player.career || '-'],
                ]);

                // 한눈에 보기: 최근 3시즌 + 통산. 계산은 quicklook.js 입니다.
                const isPitcher = player.position === '투수';
                const Q = window.PlayerAnalytics.quicklook;
                statsDiv.innerHTML = Q.tableHtml(Q.build(player, new Date().getFullYear()));
                // 프로필 아래 최근 시즌 타일입니다. 두 카드 높이를 맞출 때 남는 자리를 채웁니다.
                cardDiv.insertAdjacentHTML('beforeend', Q.tilesHtml(Q.seasonTiles(player)));
                // 무브먼트 카드(1군 투수만). 타자면 끕니다.
                setupMovementCard(player, playerId);

                // Detailed Stats Section (Pitching)
                const detailedSection = document.getElementById('detailed-stats-section');
                const detailedContent = document.getElementById('detailed-stats-content');

                if (isPitcher && player.pitcher_seasons && player.pitcher_seasons.length > 0) {
                    detailedSection.classList.remove('hidden');

                    // User Requested Header mapping (Season, Team, Age, Pitchs, W, L, ERA, G, GS, QS, CG, ShO, SV, HLD, BS, IP, TBF, H, R, ER, HR, BB, IBB, HBP, WP, BK, SO)
                    const detailedHeaders = [
                        'Season', 'Team', 'Age', 'Pitchs', 'W', 'L', 'ERA', 'G', 'GS', 'QS', 'CG', 'ShO', 'SV', 'HLD', 'BS', 'IP', 'TBF', 'H', 'R', 'ER', 'HR', 'BB', 'IBB', 'HBP', 'WP', 'BK', 'SO'
                    ];

                    const detailedMapping = [
                        { key: 'season' },
                        { key: 'player_team' },
                        { key: 'age' },
                        { key: 'number_of_pitchers' },
                        { key: 'wins' },
                        { key: 'losses' },
                        { key: 'earned_run_average', format: formatERA },
                        { key: 'games' },
                        { key: 'games_started' },
                        { key: 'quality_start' },
                        { key: 'complete_game' },
                        { key: 'shutout' },
                        { key: 'save' },
                        { key: 'hold' },
                        { key: 'blown_save' },
                        { key: 'innings_pitched' },
                        { key: 'total_batters_faced' },
                        { key: 'hits' },
                        { key: 'run' },
                        { key: 'earned_run' },
                        { key: 'home_run' },
                        { key: 'base_on_balls' },
                        { key: 'intentional_base_on_balls' },
                        { key: 'hit_by_pitch' },
                        { key: 'wild_pitch' },
                        { key: 'balk' },
                        { key: 'strikeout' }
                    ];

                    const detailedTableRows = player.pitcher_seasons.map(s => {
                        return detailedMapping.map(m => {
                            if (m.key === 'age') {
                                if (player.birthday) {
                                    const bYear = parseInt(player.birthday.toString().substring(0, 4));
                                    return s.season - bYear;
                                }
                                return '-';
                            }
                            let val = s[m.key];
                            if (val === null || val === undefined) return '-';
                            return m.format ? m.format(val) : val;
                        });
                    });

                    detailedContent.innerHTML = createTable(detailedHeaders, detailedTableRows);

                    // --- Advanced Stats Section (Pitching) ---
                    console.log("Loading Advanced stats for pitcher:", playerId);
                    const advancedSection = document.getElementById('advanced-stats-section');
                    const advancedContent = document.getElementById('advanced-stats-content');

                    const advancedHeaders = [
                        'Season', 'Team', 'Age', 'K/9', 'BB/9', 'K/BB', 'HR/9', 'K%', 'BB%', 'K-BB%', 'AVG', 'OBP', 'SLG', 'WHIP', 'BABIP'
                    ];

                    // Helper to convert IP string ("12 1/3") to decimal
                    const ipToDecimal = (ipStr) => {
                        if (!ipStr) return 0;
                        const s = ipStr.toString();
                        if (s.includes('/')) {
                            const parts = s.split(' ');
                            if (parts.length === 2) {
                                const base = parseFloat(parts[0]);
                                const frac = parts[1] === '1/3' ? 0.333 : (parts[1] === '2/3' ? 0.666 : 0);
                                return base + frac;
                            } else if (s.includes('1/3')) return 0.333;
                            else if (s.includes('2/3')) return 0.666;
                        }
                        return parseFloat(s) || 0;
                    };

                    const advancedTableRows = player.pitcher_seasons.map(s => {
                        const tbf = s.total_batters_faced || 0;
                        const so = s.strikeout || 0;
                        const bb = s.base_on_balls || 0;
                        const hr = s.home_run || 0;
                        const ipDec = ipToDecimal(s.innings_pitched);

                        // Derived metrics
                        const kPct = tbf > 0 ? (so / tbf * 100).toFixed(1) + '%' : '-';
                        const bbPct = tbf > 0 ? (bb / tbf * 100).toFixed(1) + '%' : '-';
                        const kMinusBB = tbf > 0 ? (so / tbf * 100 - bb / tbf * 100).toFixed(1) + '%' : '-';
                        const hr9 = ipDec > 0 ? ((hr * 9) / ipDec).toFixed(2) : '-';

                        // Calculate Age
                        let age = '-';
                        if (player.birthday) {
                            age = s.season - parseInt(player.birthday.toString().substring(0, 4));
                        }

                        return [
                            s.season,
                            s.player_team || '-',
                            age,
                            formatERA(s.k_9),
                            formatERA(s.bb_9),
                            s.k_bb || '-',
                            hr9,
                            kPct,
                            bbPct,
                            kMinusBB,
                            formatAverage(s.batting_average),
                            formatAverage(s.on_base_percentage),
                            formatAverage(s.slugging_percentage),
                            formatERA(s.whip || s.walks_plus_hits_per_inning_pitched),
                            formatAverage(s.babip || s.batting_average_on_balls_in_play)
                        ];
                    });

                    advancedSection.classList.remove('hidden');
                    advancedContent.innerHTML = createTable(advancedHeaders, advancedTableRows);
                    paintPercentileColors(player, pctToken).catch(err => console.warn('percentile paint failed:', err));

                    // --- Pitch Arsenal Section (Pitching): 시즌은 따로 고릅니다 ---
                    setupArsenalSection(player, playerId);

                } else {
                    detailedSection.classList.add('hidden');
                    document.getElementById('advanced-stats-section').classList.add('hidden');
                    arsToken++;
                    document.getElementById('pitch-arsenal-section').classList.add('hidden');
                }

                // Scroll to stats
                section.scrollIntoView({ behavior: 'smooth', block: 'start' });
                // Apply Team Theme Colors (For both Batters and Pitchers)
                // 비현역(현 소속팀 없음)은 잔존 team_id가 있어도 팀색을 입히지 않고 중립색(기본)
                applyTeamTheme(player.is_active ? (player.team_name || player.team_id) : null);

            } catch (error) {
                console.error("Critical error in loadPlayerInfo:", error);
                cardDiv.innerHTML = createErrorMessage('선수 정보를 불러오는데 실패했습니다.');
                statsDiv.innerHTML = '';
            }
        }

        /** 공 고르기·존 고르기·보기 select 를 한 번 잇습니다. 고르면 받아 둔 공을 화면에서 걸러 다시 그립니다. */
        function setupArsenalFilters() {
            const A = window.PlayerAnalytics.arsenal;
            const pick = document.getElementById('pa-ars-pick');
            const zone = document.getElementById('pa-ars-zone');
            const view = document.getElementById('pa-ars-view');
            zone.innerHTML = A.zoneOptions().map(o => `<option value="${o[0]}">${o[1]}</option>`).join('');
            pick.onchange = () => { arsPick = pick.value; renderPitchArsenalGrid(); };
            zone.onchange = () => { arsZone = zone.value; renderPitchArsenalGrid(); };
            view.onchange = () => { currentPitchViewMode = view.value; renderPitchArsenalGrid(); };
        }

        /** 공 고르기 항목은 응답에 그 값이 있을 때만 둡니다(API 배포 전엔 모든 공·헛스윙만). */
        function syncArsenalPick() {
            const A = window.PlayerAnalytics.arsenal;
            const pick = document.getElementById('pa-ars-pick');
            const opts = A.pickOptions(lastArsenalData);
            const html = opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('');
            if (pick.innerHTML !== html) pick.innerHTML = html;
            if (!opts.some(o => o[0] === arsPick)) arsPick = '';
            pick.value = arsPick;
        }

        function setPitchPerspective(persp) {
            currentPitchPerspective = persp;
            document.querySelectorAll('#persp-catcher, #persp-pitcher').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`persp-${persp}`);
            if (activeBtn) activeBtn.classList.add('active');
            renderPitchArsenalGrid();
        }

        // --- Pitch Arsenal(투구 위치 분포) ---------------------------------
        // 시즌은 무브먼트와 따로 고릅니다. 늦게 온 응답은 순번(arsToken)으로 버립니다.
        let arsToken = 0;

        function setupArsenalSection(player, playerId) {
            const section = document.getElementById('pitch-arsenal-section');
            const select = document.getElementById('pa-arsenal-season');
            const seasons = window.PlayerAnalytics.movement.seasonsFor(player);
            arsToken++;
            lastArsenalData = [];
            // 선수가 바뀌면 고르기는 처음으로 되돌립니다(시즌만 바꿀 땐 그대로 둡니다).
            arsPick = ''; arsZone = '';
            document.getElementById('pa-ars-zone').value = '';
            if (!seasons.length) { section.classList.add('hidden'); return; }
            select.innerHTML = seasons.map(y => `<option value="${y}">${y}</option>`).join('');
            select.value = String(seasons[0]);
            select.onchange = () => loadArsenal(playerId, Number(select.value));
            loadArsenal(playerId, seasons[0]);
        }

        async function loadArsenal(playerId, season) {
            const section = document.getElementById('pitch-arsenal-section');
            const grid = document.getElementById('pitch-arsenal-grid');
            const token = ++arsToken;
            lastArsenalData = [];
            section.classList.remove('hidden');
            grid.innerHTML = createLoadingSpinner();
            let rows = [];
            try {
                const res = await getArsenalShared(playerId, season) || {};
                rows = res.arsenal || [];
            } catch (err) {
                console.error('Error loading arsenal data:', err);
            }
            if (token !== arsToken) return;  // 그사이 다른 선수·시즌을 골랐습니다.
            lastArsenalData = rows;
            renderPitchArsenalGrid();
        }

        function renderPitchArsenalGrid() {
            const A = window.PlayerAnalytics.arsenal;
            const grid = document.getElementById('pitch-arsenal-grid');
            const section = document.getElementById('pitch-arsenal-section');
            if (!grid) return;
            syncArsenalPick();
            const note = document.getElementById('pa-ars-note');
            const total = A.groups(lastArsenalData).reduce((n, g) => n + g.n, 0);
            const rows = A.filterPitches(lastArsenalData, arsPick, arsZone);
            const groups = A.groups(rows);
            const shown = groups.reduce((n, g) => n + g.n, 0);
            if (note) {
                const on = (arsPick || arsZone) && total > 0;
                note.classList.toggle('hidden', !on);
                note.textContent = on ? `고른 공 ${shown.toLocaleString()}구 / 이 시즌 ${total.toLocaleString()}구 (${(100 * shown / total).toFixed(1)}%). 카드의 비율은 고른 공 안에서의 비율입니다.` : '';
            }
            if (!groups.length) {
                grid.innerHTML = total
                    ? '<p class="text-secondary pa-ars-empty">고른 조건에 맞는 공이 없습니다.</p>'
                    : '<p class="text-secondary pa-ars-empty">이 시즌 투구 위치 자료가 없습니다.</p>';
                return;
            }
            const zone = A.zone(lastArsenalData);
            const d3ok = window.d3 && window.d3.contours;
            const mode = (currentPitchViewMode === 'point' || !d3ok) ? 'point' : currentPitchViewMode;
            const view = document.getElementById('pa-ars-view');
            if (view && !d3ok) {
                view.value = 'point';
                view.disabled = true;
                view.title = '등고선을 불러오지 못해 공으로만 보여 줍니다.';
            }
            grid.innerHTML = groups.map(g => {
                const cs = mode !== 'point' ? A.contours(g, currentPitchPerspective, window.d3) : null;
                return '<div class="pitch-chart-item pa-ars-card">' + A.titleHtml(g) +
                    A.cardSvg(g, zone, mode, currentPitchPerspective, cs) + '</div>';
            }).join('');
        }

        /**
         * Apply team-specific background colors (bgcolor1)
         */
        function applyTeamTheme(teamName) {
            // 색은 components.js 의 공통 표를 씁니다.

            const teamColor = window.teamColor
                ? window.teamColor(teamName) : '#1e293b';

            const headerBar = document.getElementById('player-header-bar');

            if (headerBar) {
                headerBar.classList.add('theme-applied');
                headerBar.style.setProperty('--team-color', teamColor);
            }
        }

        // Initialize on page load
        function init() {
            setupArsenalFilters();
            const urlParams = new URLSearchParams(window.location.search);
            const playerId = urlParams.get('id');
            if (playerId) {
                showPlayer(playerId, urlParams.get('mode'));
            }

            const tabs = document.getElementById('player-mode-tabs');
            if (tabs) {
                tabs.addEventListener('click', (e) => {
                    const btn = e.target.closest('.leaders-tab');
                    if (!btn || btn.disabled || btn.dataset.pmode === playerMode) return;
                    if (!modePlayerId) return;
                    showPlayer(modePlayerId, btn.dataset.pmode);
                });
            }
        }

        // 뒤로 가기로 앞서 본 선수로 돌아갑니다.
        // 무브먼트 포수·투수 시점 전환입니다. 데이터는 다시 부르지 않고 다시 그립니다.
        document.addEventListener('click', (e) => {
            const btn = e.target.closest('.pa-mv-view-btn');
            if (!btn || btn.dataset.view === mvView) return;
            const M = window.PlayerAnalytics.movement;
            mvView = btn.dataset.view;
            document.querySelectorAll('.pa-mv-view-btn').forEach(b => {
                const on = b === btn;
                b.classList.toggle('active', on);
                b.setAttribute('aria-pressed', on ? 'true' : 'false');
            });
            setMovementHelp();
            if (mvLast) document.getElementById('pa-move-body').innerHTML = M.bodyHtml(mvLast.pitches, mvLast.total, mvView, mvLast.ctx);
        });

        // 무브먼트 `?` 툴팁: 터치에서는 눌러 열고, 다른 곳을 누르거나 Esc 로 닫습니다.
        (function () {
            const help = document.getElementById('pa-move-help');
            if (!help) return;
            // 일부 브라우저는 누르면 버튼에 포커스가 가서 :focus-visible 이 아니어도 닫기 표시가 필요합니다.
            help.addEventListener('click', () => {
                const opened = help.classList.toggle('open');
                if (opened) help.classList.remove('dismissed');
                else help.classList.add('dismissed');  // 포커스가 남아 있어도 닫힌 채로 둡니다.
            });
            // 마우스를 떼면 닫힘 표시를 풉니다. 맥 Safari·Firefox 는 클릭해도 포커스가 안 와 blur 가 안 옵니다.
            help.addEventListener('mouseleave', () => { help.classList.remove('dismissed'); });
            help.addEventListener('blur', () => { help.classList.remove('open'); help.classList.remove('dismissed'); });
            help.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') { help.classList.remove('open'); help.classList.add('dismissed'); }
            });
        })();

        window.addEventListener('popstate', () => {
            const p = new URLSearchParams(window.location.search);
            const id = p.get('id');
            if (id) showPlayer(id, p.get('mode'));
        });

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
