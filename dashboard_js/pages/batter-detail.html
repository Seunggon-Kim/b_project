<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Batter Detail - KBO Analytics</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        .search-row { display: flex; gap: 0.75rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
        .search-input { padding: 0.5rem 0.8rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 0.95rem; min-width: 220px; }
        .search-results { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; max-height: 240px; overflow-y: auto; min-width: 320px; display: none; position: absolute; z-index: 10; }
        .search-results .item { padding: 0.45rem 0.75rem; cursor: pointer; border-bottom: 1px solid #f3f4f6; font-size: 0.9rem; }
        .search-results .item:hover { background: #eff6ff; }
        .header-card { background: linear-gradient(135deg, #1e40af, #2563eb); color: #fff; border-radius: 10px; padding: 1.25rem 1.5rem; margin-bottom: 1.5rem; }
        .header-card h2 { margin: 0; font-size: 1.6rem; }
        .header-card .meta { font-size: 0.92rem; opacity: 0.85; margin-top: 0.4rem; }
        .chart-card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.5rem; }
        .chart-card h3 { margin: 0 0 0.4rem 0; font-size: 1.05rem; }
        .chart-wrap { position: relative; height: 320px; }
        .table-wrap { overflow-x: auto; }
        table.detail-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        table.detail-table th, table.detail-table td { padding: 0.5rem 0.6rem; text-align: right; border-bottom: 1px solid #f1f5f9; white-space: nowrap; }
        table.detail-table th { background: #f9fafb; color: #374151; font-weight: 600; text-align: center; }
        table.detail-table td.left, table.detail-table th.left { text-align: left; }
        table.detail-table td.bold { font-weight: 700; color: #1e3a8a; }
        .two-col { display: grid; grid-template-columns: 2fr 1fr; gap: 1rem; }
        @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } }
        .stadium-pill { display: inline-block; background: #f3f4f6; border-radius: 16px; padding: 0.2rem 0.6rem; font-size: 0.8rem; margin: 0.1rem; }
    </style>
    <script src="../js/theme-toggle.js"></script>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="../" class="logo"><span class="material-symbols-outlined logo-icon">sports_baseball</span><span>KBO Analytics</span></a>
            <nav class="nav">
                <a href="../" class="nav-link">홈</a>
                <a href="team-stats.html" class="nav-link">팀 통계</a>
                <a href="player-stats.html" class="nav-link">선수 통계</a>
                <a href="player-analytics.html" class="nav-link">선수 분석</a>
                <a href="wrc-comparison.html" class="nav-link">wRC+ 강건성</a>
                <a href="batter-detail.html" class="nav-link active">선수 상세</a>
                <a href="database-explorer.html" class="nav-link">데이터 탐색</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="fade-in"><span class="material-symbols-outlined">sports_baseball</span> Batter Detail — wRC+ History (2015~2026)</h1>
        <p class="text-secondary mb-3">선수의 시즌별 wOBA·wRC+ 추세 + 출전 stadium 분포</p>

        <div class="search-row" style="position: relative;">
            <input type="text" id="search-input" class="search-input" placeholder="선수 이름 검색 (예: 김도영, 구자욱)" autocomplete="off">
            <div id="search-results" class="search-results"></div>
            <span style="color:#6b7280; font-size:0.85rem;" id="search-hint">최소 1글자, 최근 시즌 우선 표시</span>
        </div>

        <div id="content"></div>
    </main>

    <script>
    const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const API = isLocal ? 'http://localhost:8000' : '/api';

    let chartTrend = null, chartStadium = null;

    async function fetchJSON(path) {
        const r = await fetch(`${API}${path}`);
        if (!r.ok) throw new Error(`${path} → ${r.status}`);
        return r.json();
    }
    function fmt(v, d=1) { return v == null ? '—' : Number(v).toFixed(d); }

    async function search(q) {
        if (!q) {
            document.getElementById('search-results').style.display = 'none';
            return;
        }
        const rows = await fetchJSON(`/wrc/batter-search?q=${encodeURIComponent(q)}`);
        const seen = new Set();
        const unique = rows.filter(r => {
            if (seen.has(r.player_id)) return false;
            seen.add(r.player_id);
            return true;
        });
        const el = document.getElementById('search-results');
        el.innerHTML = unique.slice(0, 30).map(r =>
            `<div class="item" data-id="${r.player_id}" data-name="${r.player_name}">
                <strong>${r.player_name}</strong> <span style="color:#6b7280;">${r.player_team || ''} · 최근 ${r.season}</span>
            </div>`
        ).join('');
        el.style.display = unique.length ? 'block' : 'none';
        el.querySelectorAll('.item').forEach(it => {
            it.onclick = () => {
                document.getElementById('search-input').value = it.dataset.name;
                el.style.display = 'none';
                showBatter(it.dataset.id);
                history.replaceState(null, '', `?id=${it.dataset.id}`);
            };
        });
    }

    async function showBatter(id) {
        const data = await fetchJSON(`/wrc/batter/${id}`);
        const c = document.getElementById('content');
        if (!data.history || data.history.length === 0) {
            c.innerHTML = `<div style="color:#dc2626; padding:1rem; background:#fef2f2; border-radius:6px;">선수 ID ${id} 데이터 없음.</div>`;
            return;
        }
        const latest = data.history[data.history.length - 1];

        c.innerHTML = `
            <div class="header-card">
                <h2>${data.player_name || 'Unknown'} <small style="font-weight:400; opacity:0.8;">(ID ${id})</small></h2>
                <div class="meta">최근 시즌: ${latest.season} ${latest.player_team || ''} · ${latest.PA} PA · wRC+ <strong>${fmt(latest.wRC_half)}</strong> (Half-PF)</div>
            </div>

            <div class="two-col">
                <div class="chart-card">
                    <h3>시즌별 wRC+ 추세</h3>
                    <div class="chart-wrap"><canvas id="chart-trend"></canvas></div>
                </div>
                <div class="chart-card">
                    <h3>최근 시즌 출전 Stadium PA 분포</h3>
                    <div class="chart-wrap"><canvas id="chart-stadium"></canvas></div>
                </div>
            </div>

            <div class="chart-card">
                <h3>시즌별 상세 (KBO 공식 + 우리 wRC+)</h3>
                <div class="table-wrap">
                    <table class="detail-table">
                        <thead>
                            <tr>
                                <th>시즌</th><th>팀</th><th>PA</th>
                                <th>AVG</th><th>OBP</th><th>SLG</th><th>OPS</th>
                                <th>wOBA</th><th>wRAA</th>
                                <th class="left">홈구장</th>
                                <th>home PF</th><th>weighted PF</th>
                                <th>wRC+ home</th><th>wRC+ <strong>half</strong></th><th>wRC+ weighted</th>
                            </tr>
                        </thead>
                        <tbody>
                        ${data.history.map(r => `
                            <tr>
                                <td><strong>${r.season}</strong></td>
                                <td>${r.player_team || '—'}</td>
                                <td>${r.PA}</td>
                                <td>${fmt(r.AVG, 3)}</td>
                                <td>${fmt(r.OBP, 3)}</td>
                                <td>${fmt(r.SLG, 3)}</td>
                                <td>${fmt(r.OPS, 3)}</td>
                                <td>${fmt(r.wOBA, 3)}</td>
                                <td>${fmt(r.wRAA, 1)}</td>
                                <td class="left">${r.home_stadium || '—'}</td>
                                <td>${fmt(r.home_pf, 0)}</td>
                                <td>${fmt(r.weighted_pf, 1)}</td>
                                <td>${fmt(r.wRC_home, 1)}</td>
                                <td class="bold">${fmt(r.wRC_half, 1)}</td>
                                <td>${fmt(r.wRC_weighted, 1)}</td>
                            </tr>
                        `).join('')}
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="chart-card">
                <h3>시즌별 Stadium PA 분포 (Top 5 stadium)</h3>
                <div id="stadium-pills"></div>
            </div>
        `;

        renderTrend(data.history);
        renderStadium(data.stadium_distribution, latest.season);
        renderStadiumPills(data.stadium_distribution);
    }

    function renderTrend(hist) {
        if (chartTrend) chartTrend.destroy();
        const seasons = hist.map(r => r.season);
        chartTrend = new Chart(document.getElementById('chart-trend').getContext('2d'), {
            type: 'line',
            data: {
                labels: seasons,
                datasets: [
                    { label: 'wRC+ Half', data: hist.map(r => r.wRC_half), borderColor: '#2563eb', backgroundColor: '#2563eb33', tension: 0.2, borderWidth: 3 },
                    { label: 'wRC+ home', data: hist.map(r => r.wRC_home), borderColor: '#9ca3af', borderDash: [4, 4], tension: 0.2 },
                    { label: 'wRC+ weighted', data: hist.map(r => r.wRC_weighted), borderColor: '#059669', borderDash: [4, 4], tension: 0.2 },
                ],
            },
            options: {
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom' } },
                scales: {
                    y: { title: { display: true, text: 'wRC+' }, suggestedMin: 50, suggestedMax: 200 },
                },
            },
        });
    }

    function renderStadium(dist, season) {
        if (chartStadium) chartStadium.destroy();
        const cur = dist.filter(d => parseInt(d.season) === season);
        const labels = cur.map(d => d.stadium);
        const data = cur.map(d => d.pa);
        chartStadium = new Chart(document.getElementById('chart-stadium').getContext('2d'), {
            type: 'doughnut',
            data: {
                labels,
                datasets: [{ data, backgroundColor: ['#2563eb','#059669','#dc2626','#f59e0b','#8b5cf6','#06b6d4','#84cc16','#ec4899','#6366f1','#14b8a6','#f97316','#a855f7'] }],
            },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'right' } } },
        });
    }

    function renderStadiumPills(dist) {
        const bySeason = {};
        dist.forEach(d => {
            (bySeason[d.season] = bySeason[d.season] || []).push(d);
        });
        const c = document.getElementById('stadium-pills');
        c.innerHTML = Object.keys(bySeason).sort((a, b) => b - a).map(s => {
            const top5 = bySeason[s].slice(0, 5);
            return `<div style="margin:0.5rem 0;"><strong>${s}</strong>: ${top5.map(d => `<span class="stadium-pill">${d.stadium} ${d.pa}</span>`).join('')}</div>`;
        }).join('');
    }

    // Init: URL ?id= or empty
    const params = new URLSearchParams(location.search);
    const initId = params.get('id');
    if (initId) showBatter(initId);

    let searchTimer;
    document.getElementById('search-input').addEventListener('input', e => {
        clearTimeout(searchTimer);
        const q = e.target.value.trim();
        searchTimer = setTimeout(() => search(q), 200);
    });
    document.addEventListener('click', e => {
        if (!e.target.closest('.search-row')) document.getElementById('search-results').style.display = 'none';
    });
    </script>
</body>
</html>
