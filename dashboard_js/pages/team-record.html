<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팀 기록실 - Bstats</title>
    <meta name="description" content="KBO 구단별 시즌 성적과 프랜차이즈 역사">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">

    <link rel="icon" href="../assets/favicon/diamond.ico" sizes="any">
    <link rel="icon" type="image/svg+xml" href="../assets/favicon/diamond.svg">
    <link rel="apple-touch-icon" href="../assets/favicon/diamond-180.png">

    <link rel="stylesheet" href="../css/style.css">
    <style>
        /* 팀 고르개입니다. 팀 이름으로 고릅니다. 알약을 죽 늘어놓으면
           옛 이름까지 넣었을 때 스물세 개가 되어 줄이 넘칩니다. */
        .tr-picker {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
        }

        .tr-pick-label { color: var(--text-muted); font-size: 0.9rem; }
        .tr-select { max-width: 320px; }

        .tr-head {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            padding: 1.25rem 1.5rem;
            border-radius: 12px;
            background: var(--team-color, #1e293b);
            /* 쌍방울(#FFC81E)이나 삼미(#88B7E1)처럼 밝은 구단색 위에는
               흰 글자가 읽히지 않습니다. 밝기를 재서 정합니다. */
            color: var(--team-ink, #fff);
            margin-bottom: 1.5rem;
        }

        /* 로고 뒤에 흰 바탕을 깝니다. KIA 로고는 빨강이고 구단색도
           빨강(#EA0029)이라 그냥 올리면 묻혀서 안 보입니다. 한 팀만
           예외를 두면 나중에 또 겹치므로 모든 팀에 같이 깝니다. */
        .tr-head img {
            width: 64px;
            height: 64px;
            object-fit: contain;
            background: #fff;
            border-radius: 10px;
            padding: 6px;
            box-sizing: border-box;
        }
        .tr-name { font-size: 1.6rem; font-weight: 700; }
        .tr-sub { font-size: 0.9rem; opacity: .85; }
        .tr-headnums { margin-left: auto; text-align: right; }
        .tr-headnums .big { font-size: 1.3rem; font-weight: 700; }

        .tr-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        @media (max-width: 860px) {
            .tr-grid { grid-template-columns: 1fr; }
        }

        .tr-facts { list-style: none; padding: 0; margin: 0; }
        .tr-facts li {
            display: flex;
            justify-content: space-between;
            gap: 1rem;
            padding: 0.5rem 0;
            border-top: 1px solid var(--border-color);
        }
        .tr-facts li:first-child { border-top: none; }
        /* 라벨 열을 고정합니다. 폭을 내용에 맡기면 '비고' 처럼 값이 긴
           행에서 라벨이 눌려 다른 행과 어긋납니다. '한국시리즈 우승'
           이 가장 긴 라벨이라 그 폭에 맞춥니다. */
        .tr-facts .k { color: var(--text-muted); flex: 0 0 8rem; }
        .tr-facts .v { flex: 1; font-weight: 600; text-align: right; }

        .tr-note { font-size: 0.85rem; color: var(--text-muted); margin-top: 0.5rem; }

        /* 시즌별 표 쪽 넘김입니다. 45시즌을 한 번에 쏟으면 화면이
           스크롤로만 남습니다. */
        .tr-pager {
            display: flex;
            gap: 0.35rem;
            flex-wrap: wrap;
            margin-top: 0.75rem;
        }

        .tr-pager button {
            min-width: 2.2rem;
            padding: 0.35rem 0.6rem;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--bg-card);
            color: inherit;
            cursor: pointer;
            font: inherit;
            font-size: 0.85rem;
        }

        .tr-pager button.active {
            font-weight: 700;
            border-color: var(--text-secondary);
        }

        .tr-pager button.nav { min-width: auto; }
        .tr-pager .tr-gap {
            align-self: center;
            color: var(--text-muted);
            padding: 0 0.15rem;
        }
        .tr-pager button:disabled { opacity: .45; cursor: default; }
    </style>
    <script src="../js/config.js"></script>
    <script src="../js/theme-toggle.js"></script>
    <script src="../js/nav.js"></script>
</head>

<body>
    <header class="header">
        <div class="header-content">
            <a href="../" class="logo">
                <img src="../assets/favicon/diamond.svg" alt="" class="logo-icon" width="26" height="26">
                <span>Bstats</span>
            </a>
            <nav class="nav">
                <a href="../" class="nav-link">홈</a>
                <a href="team-stats" class="nav-link active">팀 통계</a>
                <a href="player-stats" class="nav-link">선수 통계</a>
                <a href="player-analytics" class="nav-link">선수 분석</a>
                <a href="article" class="nav-link">아티클</a>
                <a href="factor-stats" class="nav-link">요인 통계</a>
                <a href="database-explorer" class="nav-link">데이터 탐색</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <h1 class="fade-in">팀 기록실</h1>
        <p class="text-secondary mb-3">구단별 시즌 성적과 역사입니다. 팀 이름이 바뀌어도 한 구단으로 이어 봅니다.</p>

        <div class="tr-picker">
            <label class="tr-pick-label" for="team-select">구단</label>
            <select id="team-select" class="input tr-select"></select>
        </div>

        <section id="team-body" class="hidden">
            <div id="tr-head" class="tr-head"></div>

            <div class="tr-grid">
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title mb-2">구단 개요</h3>
                        <ul id="tr-facts" class="tr-facts"></ul>
                        <p class="tr-note">한국시리즈에서 우승한 횟수입니다. 정규시즌 1위와 다릅니다.</p>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body">
                        <h3 class="card-title mb-2" id="tr-cur-title">올 시즌</h3>
                        <ul id="tr-current" class="tr-facts"></ul>
                        <p class="tr-note">순위·승패는 KBO 기록실, 타율·ERA 는 공식 기록을 합친 값입니다.</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <h3 class="card-title mb-2" id="tr-seasons-title">시즌별 성적</h3>
                    <div id="tr-seasons"></div>
                    <div id="tr-pager" class="tr-pager"></div>
                    <p class="tr-note">순위·승패는 KBO 기록실, 팀 타율·ERA 는 공식 기록을 합친 값입니다.</p>
                </div>
            </div>
        </section>

        <div id="tr-empty" class="card"><div class="card-body">
            <p class="text-muted">위에서 구단을 고르십시오.</p>
        </div></div>
    </main>

    <script src="../js/api.js"></script>
    <script src="../js/components.js"></script>
    <script>
        // 팀 기록실입니다.
        //
        // 주소는 `?id=HT` 입니다. franchise_id 를 씁니다. 팀 이름은
        // 시대에 따라 바뀌므로(해태 -> KIA) 이름을 주소에 쓰면 옛
        // 시즌으로 들어오는 길이 막힙니다.

        // 고르개에 넣을 팀 이름입니다.
        //
        // **프랜차이즈가 아니라 팀 이름으로 고릅니다.** 'KIA' 하나만
        // 두면 해태를 찾는 사람이 갈 곳이 없습니다. 옛 이름도 함께
        // 늘어놓고, 고르면 그 팀이 속한 구단 페이지로 갑니다.
        //
        // 페이지는 계보 전체를 보여 줍니다. 해태를 고르든 KIA 를
        // 고르든 같은 화면이고, 표에 그 해 이름이 그대로 나옵니다.
        //
        // 이어지지 않는 것에 주의하십시오. 현대(HD)와 키움(WO)은 다른
        // 구단이고, 쌍방울(SB)과 SSG(SK)도 다릅니다.
        const TEAM_OPTIONS = [
            { group: '현재 구단', items: [
                { id: 'HT', name: 'KIA' }, { id: 'SS', name: '삼성' },
                { id: 'LG', name: 'LG' }, { id: 'OB', name: '두산' },
                { id: 'LT', name: '롯데' }, { id: 'HH', name: '한화' },
                { id: 'SK', name: 'SSG' }, { id: 'WO', name: '키움' },
                { id: 'NC', name: 'NC' }, { id: 'KT', name: 'KT' },
            ] },
            { group: '옛 이름', items: [
                { id: 'HT', name: '해태', span: '1982~2000' },
                { id: 'LG', name: 'MBC', span: '1982~1989' },
                { id: 'OB', name: 'OB', span: '1982~1998' },
                { id: 'HH', name: '빙그레', span: '1986~1993' },
                { id: 'SK', name: 'SK', span: '2000~2020' },
                { id: 'WO', name: '넥센', span: '2010~2018' },
                { id: 'WO', name: '히어로즈', span: '2009' },
                { id: 'WO', name: '우리', span: '2008' },
            ] },
            { group: '없어진 구단', items: [
                { id: 'HD', name: '현대', span: '1996~2007' },
                { id: 'HD', name: '태평양', span: '1988~1995' },
                { id: 'HD', name: '청보', span: '1985~1987' },
                { id: 'HD', name: '삼미', span: '1982~1984' },
                { id: 'SB', name: '쌍방울', span: '1991~1999' },
            ] },
        ];

        function esc(v) {
            return String(v ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;',
                '"': '&quot;', "'": '&#39;',
            }[c]));
        }

        function fmt3(v) {
            return (v === null || v === undefined) ? '-' : Number(v).toFixed(3);
        }

        function fmt2(v) {
            return (v === null || v === undefined) ? '-' : Number(v).toFixed(2);
        }

        /**
         * 머리에 올릴 로고입니다. 없으면 빈 문자열입니다.
         *
         * **지금 뛰는 열 구단만 로고를 답니다.** 저장소에 있는 로고는
         * 프랜차이즈 단위여서, 청보를 골랐는데 현대 로고를 보이면
         * 틀린 그림이 됩니다. 옛 이름과 없어진 구단은 로고를 비웁니다.
         *
         * 판정은 두 가지입니다.
         *
         *     franchise.last_season 이 있다  ->  해체된 구단
         *     고른 이름 != current_name      ->  옛 이름
         *
         * 둘 중 하나라도 걸리면 로고를 달지 않습니다.
         */
        function headLogo(f, picked) {
            if (f.last_season) return '';
            if (picked && picked !== f.current_name) return '';
            return logoTag(f.franchise_id, '');
        }

        function logoTag(id, cls) {
            return `<img class="${cls}" src="../assets/logos/${esc(id)}.png"`
                + ` alt="" loading="lazy" onerror="this.style.display='none'">`;
        }

        function renderPicker(active, name) {
            const sel = document.getElementById('team-select');
            sel.innerHTML = '<option value="">구단을 고르십시오</option>'
                + TEAM_OPTIONS.map(g => {
                    const opts = g.items.map(t => {
                        const label = t.span
                            ? `${t.name} (${t.span})` : t.name;
                        // 같은 구단이 여러 이름으로 나오므로 value 에
                        // 이름을 함께 둡니다. 그래야 고른 항목이 유지됩니다.
                        const v = `${t.id}|${t.name}`;
                        return `<option value="${v}">${esc(label)}</option>`;
                    }).join('');
                    return `<optgroup label="${esc(g.group)}">${opts}</optgroup>`;
                }).join('');
            // 고른 이름까지 주소에 실어야 새로고침해도 유지됩니다.
            if (name) {
                const exact = [...sel.options].find(
                    o => o.value === `${active}|${name}`);
                if (exact) sel.value = exact.value;
            } else if (active) {
                // 이름 없이 `?id=HT` 로 들어온 경우입니다. 그 구단의 첫
                // 항목을 고른 것처럼 보이되 표는 계보 전체를 보입니다.
                const match = [...sel.options].find(
                    o => o.value.split('|')[0] === active);
                if (match) sel.value = match.value;
            }
            sel.addEventListener('change', () => {
                const [id, picked] = sel.value.split('|');
                if (!id) return;
                window.location.href = `?id=${encodeURIComponent(id)}`
                    + `&name=${encodeURIComponent(picked || '')}`;
            });
        }

        // 시즌별 표에 넣을 항목입니다. 순위·승패는 KBO 기록실에서,
        // 타율·ERA 는 공식 기록을 합친 값입니다.
        const SEASON_COLS = [
            ['시즌', s => s.season],
            ['팀명', s => s.team_name],
            ['리그', s => (s.league && s.league !== '단일') ? s.league : '-'],
            ['순위', s => s.rank ?? '-'],
            ['경기', s => s.games ?? '-'],
            ['승', s => s.wins ?? '-'],
            ['패', s => s.losses ?? '-'],
            ['무', s => s.draws ?? '-'],
            ['승률', s => s.pct ?? '-'],
            ['타율', s => fmt3(s.avg)],
            ['홈런', s => s.home_run ?? '-'],
            ['ERA', s => fmt2(s.era)],
        ];

        function renderSeasons(seasons) {
            if (!seasons.length) {
                return '<p class="text-muted">시즌 기록이 없습니다.</p>';
            }
            const head = SEASON_COLS.map(c => c[0]);
            const rows = seasons.map(s => SEASON_COLS.map(c => c[1](s)));
            return createTable(head, rows);
        }

        /**
         * 한국시리즈 우승 문구입니다.
         *
         * 1985년은 한국시리즈가 열리지 않았습니다. 삼성이 전기·후기를
         * 모두 1위로 끝내 통합우승했기 때문입니다. 우승으로 세되 그
         * 사실을 괄호로 밝힙니다. 밝히지 않으면 삼성 우승이 8회인지
         * 7회인지를 두고 헷갈립니다.
         */
        function championLine(c) {
            const n = (c && c.count) || 0;
            if (!n) return '없음';
            const skipped = (c && c.no_series) || [];
            const tail = skipped.length
                ? ` (${skipped.join('·')} 통합우승 포함)` : '';
            return `${n}회${tail}`;
        }

        /** 고른 기간의 마지막 홈구장입니다. 없으면 null 입니다. */
        function lastStadiumIn(stadiums, scope) {
            const rows = (stadiums || []).filter(
                s => s.season >= scope.first_season
                    && s.season <= scope.last_season);
            return rows.length ? rows[rows.length - 1].stadium : null;
        }

        /** 가장 최근 홈구장입니다. 없으면 null 입니다. */
        function latestStadium(stadiums) {
            if (!stadiums || !stadiums.length) return null;
            return stadiums[stadiums.length - 1].stadium || null;
        }

        // 시즌별 표는 한 쪽에 다섯 시즌입니다. 45시즌을 한 번에 쏟으면
        // 화면이 스크롤로만 남습니다.
        const SEASONS_PER_PAGE = 5;
        let seasonState = { rows: [], page: 0, size: SEASONS_PER_PAGE };

        function renderSeasonPage() {
            const { rows, page, size } = seasonState;
            const slice = rows.slice(page * size, (page + 1) * size);
            document.getElementById('tr-seasons').innerHTML = renderSeasons(slice);

            const pages = Math.ceil(rows.length / size) || 1;
            // 보통 쪽 넘김입니다. 이전·다음과 쪽 번호를 둡니다.
            const btn = (label, target, cls) => {
                const off = target === null;
                return `<button type="button"${off ? ' disabled' : ''}`
                    + `${off ? '' : ` data-page="${target}"`}`
                    + `${cls ? ` class="${cls}"` : ''}>${label}</button>`;
            };
            // 45시즌이면 아홉 쪽입니다. 번호를 다 늘어놓으면 줄이
            // 길어지므로 지금 쪽 둘레만 보이고 양 끝은 항상 둡니다.
            const WINDOW = 2;
            const show = new Set([0, pages - 1]);
            for (let i = page - WINDOW; i <= page + WINDOW; i += 1) {
                if (i >= 0 && i < pages) show.add(i);
            }
            const btns = [btn('이전', page > 0 ? page - 1 : null, 'nav')];
            let gap = false;
            for (let i = 0; i < pages; i += 1) {
                if (!show.has(i)) { gap = true; continue; }
                if (gap) { btns.push('<span class="tr-gap">...</span>'); gap = false; }
                btns.push(btn(String(i + 1), i, i === page ? 'active' : ''));
            }
            btns.push(btn('다음', page < pages - 1 ? page + 1 : null, 'nav'));
            document.getElementById('tr-pager').innerHTML =
                pages > 1 ? btns.join('') : '';
        }

        function setSeasons(rows) {
            seasonState = { rows, page: 0, size: SEASONS_PER_PAGE };
            renderSeasonPage();
        }

        document.addEventListener('click', (e) => {
            const btn = e.target.closest('#tr-pager button');
            if (!btn) return;
            seasonState.page = Number(btn.dataset.page) || 0;
            renderSeasonPage();
        });

        async function load(id, picked) {
            const body = document.getElementById('team-body');
            const empty = document.getElementById('tr-empty');
            // 이름을 함께 보내면 통산 성적과 우승을 그 이름일 때로
            // 좁혀서 돌려줍니다.
            const q = picked ? `?name=${encodeURIComponent(picked)}` : '';
            const res = await fetch(
                `${API_BASE_URL}/teams/${encodeURIComponent(id)}${q}`);
            if (!res.ok) {
                empty.querySelector('p').textContent = '그 구단을 찾지 못했습니다.';
                body.classList.add('hidden');
                empty.classList.remove('hidden');
                return;
            }
            const d = await res.json();
            const f = d.franchise || {};
            const seasons = d.seasons || [];
            const career = d.career || {};

            const eras = (d.eras || []).map(e => {
                const span = e.from === e.to ? `${e.from}` : `${e.from}~${e.to}`;
                return `${esc(e.team_name)} ${span}`;
            }).join(' · ');
            // 고른 이름의 마지막 시즌입니다. 청보를 골랐으면 1987년이지
            // 2007년이 아닙니다.
            const scopedRows = picked
                ? seasons.filter(r => r.team_name === picked) : seasons;
            const latest = scopedRows[0];
            // 해체된 구단은 `current_name` 이 없습니다. '현재 이름' 이란
            // 것이 없으니 맞습니다. 그럴 때는 마지막으로 쓰던 이름을
            // 씁니다. 안 그러면 머리에 'SB' 같은 코드가 뜹니다.
            const lastEra = (d.eras || [])[(d.eras || []).length - 1];
            // 고른 이름이 있으면 그 이름을 머리에 씁니다. 청보를
            // 골랐는데 '현대' 가 뜨면 안 됩니다.
            const scope = d.scope || null;
            const title = picked
                || f.current_name
                || (lastEra && lastEra.team_name)
                || f.franchise_id;

            // 팀 색은 components.js 의 공통 표를 씁니다. 선수 분석과
            // 같은 값이라야 두 화면이 어긋나 보이지 않습니다.
            //
            // 고른 이름으로 찾습니다. 태평양을 고르면 태평양 색입니다.
            // 프랜차이즈 코드로 찾으면 해체 구단은 `current_name` 이
            // 없어 기본 남색으로 떨어졌습니다.
            const head = document.getElementById('tr-head');
            const color = window.teamColor
                ? window.teamColor(picked || title) : '#1e293b';
            head.style.setProperty('--team-color', color);
            head.style.setProperty(
                '--team-ink', window.textOn ? window.textOn(color) : '#fff');
            head.innerHTML = headLogo(f, picked)
                + '<div>'
                + `<div class="tr-name">${esc(title)}</div>`
                + `<div class="tr-sub">${eras}</div>`
                + '</div>'
                + '<div class="tr-headnums">'
                + (latest
                    ? `<div class="big">${esc(latest.season)} ${latest.rank ?? '-'}위</div>`
                      + `<div class="tr-sub">${latest.wins ?? '-'}승 ${latest.losses ?? '-'}패`
                      + ` ${latest.draws ?? '-'}무</div>`
                    : '<div class="tr-sub">시즌 기록 없음</div>')
                + '</div>';

            // 해체된 구단은 마지막 해까지 함께 씁니다.
            const founded = f.last_season
                ? `${f.first_season}년 (${f.last_season} 해체)`
                : `${f.first_season}년`;
            // 옛 이름을 골랐으면 '창단 연도' 가 아니라 '활동 기간'
            // 입니다. 청보는 1985년에 창단한 것이 아니라 삼미를 인수해
            // 이름을 바꾼 것입니다.
            const spanRow = scope
                ? ['활동 기간', `${scope.first_season}~${scope.last_season}`]
                : ['창단 연도', founded];
            const home = scope
                ? lastStadiumIn(d.stadiums || [], scope)
                : latestStadium(d.stadiums || []);
            document.getElementById('tr-facts').innerHTML = [
                spanRow,
                ...(home ? [['홈구장', home]] : []),
                ['통산 전적', `${career.wins ?? 0}승 ${career.losses ?? 0}패 ${career.draws ?? 0}무`],
                ['통산 승률', fmt3(career.pct)],
                ['한국시리즈 우승', championLine(d.champions)],
                ...(f.note ? [['비고', f.note]] : []),
            ].map(([k, v]) => `<li><span class="k">${esc(k)}</span>`
                + `<span class="v">${esc(v)}</span></li>`).join('');

            // 오른쪽 칸은 올 시즌 기록입니다. 홈구장 변천은 구단 개요의
            // 한 줄로 줄였습니다. 45줄짜리 표가 될 자리는 아닙니다.
            const cur = scopedRows[0];
            const cur2 = scopedRows[0];
            document.getElementById('tr-cur-title').textContent =
                cur2 ? `${cur2.season} 시즌` : '올 시즌';
            document.getElementById('tr-current').innerHTML = cur ? [
                ['순위', cur.rank ? `${cur.rank}위` : '-'],
                ['전적', `${cur.wins ?? 0}승 ${cur.losses ?? 0}패 ${cur.draws ?? 0}무`],
                ['승률', cur.pct ?? '-'],
                ['팀 타율', fmt3(cur.avg)],
                ['팀 홈런', cur.home_run ?? '-'],
                ['팀 ERA', fmt2(cur.era)],
            ].map(([k, v]) => `<li><span class="k">${esc(k)}</span>`
                + `<span class="v">${esc(v)}</span></li>`).join('')
                : '<li><span class="k">시즌 기록이 없습니다</span></li>';

            // 고른 이름이 있으면 그 이름으로 뛴 시즌만 보입니다.
            // 태평양을 고르면 1988~1995 만 나옵니다. 이름 없이
            // `?id=HD` 로 들어오면 계보 전체가 나옵니다.
            const shown = picked
                ? seasons.filter(r => r.team_name === picked) : seasons;
            document.getElementById('tr-seasons-title').textContent =
                picked ? `시즌별 성적 · ${picked}` : '시즌별 성적';
            setSeasons(shown);

            body.classList.remove('hidden');
            empty.classList.add('hidden');
        }

        function init() {
            const q = new URLSearchParams(window.location.search);
            const id = q.get('id');
            // 고른 팀 이름입니다. 있으면 그 이름으로 뛴 시즌만 보입니다.
            const name = q.get('name') || '';
            renderPicker(id, name);
            if (id) load(id, name);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>

</html>
