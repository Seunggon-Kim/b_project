# Cloudflare Workers 설정
#
# 배포 주소: https://kbo-api.bstats-baseball.workers.dev
#   name(kbo-api) + 계정 서브도메인(bstats-baseball) 으로 만들어집니다.
#   서브도메인은 계정당 하나이고 대시보드 Workers & Pages > Account Details 에서 바꿉니다.
#   바꾸면 이전 주소가 즉시 죽으므로, 프론트엔드를 붙인 뒤에는 손대지 않습니다.
#
# 참고: docs/superpowers/specs/2026-08-17-cloudflare-migration-design.md
#
# D1 바인딩은 2026-10-04 에 지웠습니다. Worker 는 MySQL(Cloud SQL)만 읽습니다.
# test/no_d1.test.js 가 D1 바인딩이 다시 들어오지 않게 막습니다.

name = "kbo-api"
main = "src/index.js"
compatibility_date = "2026-08-17"

# 함수 이름 보존(esbuild keepNames)을 끕니다. 켜 두면 번들이 화살표 함수를
# 만들 때마다 __name(fn, "…") 으로 이름을 다시 붙입니다(Object.defineProperty).
# mysql2 의 정적 행 해석기(disableEval)는 칸마다 화살표 함수를 만들어서,
# 행이 많은 응답에서 이것이 Worker CPU 의 절반 가까이를 썼습니다(로컬 프로파일:
# play_by_play CSV 2만 행 약 2.2초 -> 1.0초). 무료 플랜은 요청당 CPU 10ms 입니다.
# 압축(minify)을 하지 않아 함수 이름은 그대로 남고, 응답 본문은 바뀌지 않습니다.
keep_names = false

# Workers Cache (2026-07-06 출시). 전 플랜 무료이고 workers.dev 에서도
# 동작합니다. 캐시에 맞으면 Worker 가 실행되지 않아 DB 읽기가 0 입니다.
# 응답의 Cache-Control 로 수명을 정합니다 - src/lib/cachepolicy.js
[cache]
enabled = true

# MySQL(Cloud SQL)을 Hyperdrive 로 읽습니다. 접속 정보는 Cloudflare 에만 있습니다.
# 라우트는 요청마다 env.MYSQL 어댑터로 읽습니다(src/lib/backend.js).
[[hyperdrive]]
binding = "HYPERDRIVE"
id = "f63b3e022f1f4eff99728eb28b08ccaa"
