server {
    server_name bstats.duckdns.org;

    location = / {
        return 301 /kbo/;
    }

    # /kbo (no trailing slash) -> /kbo/
    location = /kbo {
        return 301 /kbo/$is_args$args;
    }

    # /kbo/pages(/) has no index file -> normalize to home instead of 403
    location = /kbo/pages {
        return 301 /kbo/$is_args$args;
    }
    location = /kbo/pages/ {
        return 301 /kbo/$is_args$args;
    }

    # KBO Dashboard - public serving with clean URLs (no .html in address bar)
    location /kbo/ {
        alias /home/ubuntu/b_project/dashboard_js/;

        # Old .html URLs (and bare /index) -> 301 to clean URL.
        # Checked against $request_uri (the original client request), so the
        # index module's internal redirect to /kbo/index.html is NOT affected.
        # [^?] keeps the match inside the path - query strings are preserved as $2.
        if ($request_uri ~ ^/kbo/([^?]*/)?index(?:\.html)?(\?.*)?$) {
            return 301 /kbo/$1$2;
        }
        if ($request_uri ~ ^/kbo/([^?]+)\.html(\?.*)?$) {
            return 301 /kbo/$1$2;
        }

        # Map extensionless requests to the matching .html file.
        # New pages get clean URLs automatically - no config change needed.
        # No catch-all fallback: missing paths return an honest 404.
        try_files $uri $uri/ $uri.html =404;
    }

    # KBO API (no auth)
    location /api/ {
        proxy_read_timeout 180s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/bstats.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/bstats.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = bstats.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name bstats.duckdns.org;
    return 404; # managed by Certbot


}
