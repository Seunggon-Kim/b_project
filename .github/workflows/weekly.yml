name: weekly

# 파크팩터·wRC+·RE24 를 다시 계산합니다.
# EC2 crontab 의 `park_factors/run_pipeline.sh` (매일 05:00 KST) 를 대신합니다.
#
# ## 왜 매일이 아니라 주 1회인가
#
# 이 계산은 `play_by_play` 전체를 훑습니다. Worker 에서는 못 합니다
# (10ms CPU 제한). 그래서 러너가 MySQL 에서 계산에 쓰는 표를 내려받아
# SQLite 를 만들고 기존 파이프라인을 그대로 돌립니다. 예전에는 D1 에서
# 받았는데, 12시즌이면 약 400만 행 읽기라 하루 무료 한도(500만)를 거의
# 다 썼습니다(2단계에서 바꿈). 파크팩터는 하루 새 경기 다섯 개로 소수점
# 아래가 흔들리는 정도라 주 1회면 충분합니다.
#
# ## 필요한 시크릿
#
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / ADMIN_TOKEN

on:
  # 일정은 꺼 두었습니다(2026-10, D1 무료 한도 보호). D1 에서 400만 행을
  # 내려받아 한 번에 하루 한도의 대부분을 씁니다. MySQL 에서 내려받도록
  # 바꾼 뒤(2단계 2B Task 7) 다시 켭니다.
  #   schedule:
  #     - cron: '47 20 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-park-factors
  cancel-in-progress: false

# CSV 를 Releases 에 올리려면 쓰기 권한이 필요합니다. 저장소 기본값이
# 읽기 전용이면 GITHUB_TOKEN 으로 릴리스를 못 만듭니다.
#
#   HTTP 403: Resource not accessible by integration
#   https://api.github.com/repos/.../releases
#
# 여기서 명시하면 저장소 기본값이 읽기 전용이어도 이 워크플로만
# 쓰기를 얻습니다. 필요한 것만 올리고 나머지는 기본값(읽기)입니다.
permissions:
  contents: write
  id-token: write

env:
  API_BASE: https://kbo-api.bstats-baseball.workers.dev
  KBO_DB: /tmp/kbo_pipeline.db

jobs:
  park-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      # MySQL 이 D1 과 같다는 매일 대조가 켜진 뒤에만 돕니다. 그 전에 돌면
      # 낡은 MySQL 로 계산한 값을 D1 에 올리게 됩니다. 무엇보다 먼저 확인합니다.
      - name: MySQL 이중 적재 켜짐 확인
        id: guard
        run: |
          if [ "${{ vars.MYSQL_MIRROR }}" != "on" ]; then
            echo "저장소 변수 MYSQL_MIRROR 가 on 이 아닙니다. 2B Task 9 뒤에 돌리십시오."
            exit 1
          fi

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pymysql cryptography

      - name: 인증 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 이 없습니다."
            exit 1
          fi
          npx --yes wrangler@4 d1 info kbo-stats > /dev/null

      # 러너 디스크는 14GB 입니다. 12시즌 DB 가 1.3GB 라 들어갑니다.
      # 다만 여유를 확인하고 시작합니다.
      - name: 디스크 확인
        run: df -h /tmp | tail -1

      - name: GCP 인증(키 없음)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_LOADER_SA }}

      - name: MySQL 연결
        id: mysql
        env:
          CLOUDSQL_INSTANCE: ${{ secrets.CLOUDSQL_INSTANCE }}
          MYSQL_LOADER_PASSWORD: ${{ secrets.MYSQL_LOADER_PASSWORD }}
          MYSQL_SERVER_PUBKEY: ${{ secrets.MYSQL_SERVER_PUBKEY }}
          MIRROR_MODE: shadow
        run: bash migration/mysql/ci_proxy.sh

      - name: MySQL 내려받기
        id: pull
        run: python -m migration.mysql.mysql_to_sqlite --out "$KBO_DB"

      # 원천에서 중간에 끊긴 경기를 가려 둡니다. 아래 세 계산이 이 표로 그 경기를
      # 뺍니다(park_factors/truncated.py). 2026-08-29 에 계산이 이 표를 쓰게 바뀌었는데
      # 만드는 단계가 없어 주간 작업이 첫 계산에서 계속 실패했습니다.
      - name: 잘린 경기 표 만들기
        id: truncated
        run: python park_factors/truncated.py

      - name: 파크팩터 계산
        id: pf
        if: ${{ steps.truncated.outcome == 'success' }}
        run: python park_factors/compute_self_park_factors.py

      # wOBA 가중치가 먼저 있어야 wRC+ 를 계산할 수 있습니다.
      # 예전에는 이 표를 손으로 채웠고(값은 Statiz 캡처), D1 으로
      # 넘어오지 않아 다음 단계가 첫 질의에서 죽었습니다. 그래서 이
      # 파이프라인이 한 번도 성공한 적이 없습니다.
      - name: wOBA 가중치 계산
        id: woba
        if: steps.pf.outcome == 'success'
        run: python park_factors/build_woba_weights.py --write

      - name: wRC+ 계산
        id: wrc
        if: steps.woba.outcome == 'success'
        run: python park_factors/build_wrc_plus.py

      - name: RE24·득점가치 계산
        id: re24
        if: steps.wrc.outcome == 'success'
        run: python park_factors/build_re24_run_values.py --write

      # 계산 결과를 D1 에 올리고 MySQL 에도 씁니다(sqlite_to_d1 의 mirror).
      - name: 결과 표 D1 적재
        id: push
        if: steps.re24.outcome == 'success'
        run: python migration/sqlite_to_d1.py --db "$KBO_DB"

      # --- CSV 전량 내려받기 ------------------------------------------
      #
      # Workers 에서는 큰 표를 통째로 못 보냅니다. 스트림이 **오류 없이
      # 조용히 끊깁니다.** 그래서 20,000행을 넘으면 413 과 안내를 냅니다.
      # `play_by_play` 는 136번 나눠 받아야 하는데 쓸 만하지 않습니다.
      #
      # 설계 문서는 R2 사전 생성본을 답으로 적었지만 R2 는 결제수단
      # 등록이 필요해 예산 조건에 걸립니다. 공개 저장소의 Releases 는
      # 무료이고 자산 하나에 2GB 까지 되며 저장소 용량에도 안 잡힙니다.
      #
      # 시즌별로 나눕니다. 한 덩어리 190MB 보다 18MB 짜리 열두 개가
      # 받기 좋습니다. 태그는 고정이고 자산만 매주 갈아 끼웁니다.
      - name: CSV 만들기
        id: csv
        if: steps.push.outcome == 'success'
        run: python migration/export_csv.py --out dist/csv

      - name: CSV 를 Releases 에 올리기
        id: csv_upload
        if: steps.csv.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG=data-latest
          # 릴리스가 없으면 만듭니다. 있으면 그대로 두고 자산만 바꿉니다.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "데이터 전량 내려받기" \
              --notes "매주 자동으로 갱신됩니다. play_by_play 를 시즌별 gzip CSV 로 나눠 두었습니다." \
              --latest=false
          fi
          gh release upload "$TAG" dist/csv/*.csv.gz --clobber
          gh release edit "$TAG" \
            --notes "매주 자동으로 갱신됩니다(마지막 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST).

          \`play_by_play\` 를 시즌별 gzip CSV 로 나눠 두었습니다.
          나머지 표는 2만 행 미만이라 화면에서 바로 받을 수 있습니다."

      - name: 캐시 비우기
        id: purge
        if: steps.push.outcome == 'success'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN 이 없어 캐시를 비우지 못합니다."
            exit 1
          fi
          code=$(curl -s -o /tmp/purge.txt -w '%{http_code}' -X POST \
            "$API_BASE/admin/purge-cache" -H "Authorization: Bearer $ADMIN_TOKEN")
          cat /tmp/purge.txt; echo
          test "$code" = "200"

      - name: 결과 기록
        if: ${{ always() && steps.guard.outcome == 'success' }}
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job park_factors \
            --status ${{ steps.push.outcome == 'success' && 'ok' || 'fail' }} \
            --note "내려받기 ${{ steps.pull.outcome }} / 계산 ${{ steps.re24.outcome }}"

      - name: MySQL 이중 적재 실패 확인
        id: mirror_check
        if: ${{ always() && steps.mysql.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -s "$BSTATS_MYSQL_FAIL_LOG" ]; then
            echo "MySQL 에 쓰지 못한 작업이 있습니다:"
            cat "$BSTATS_MYSQL_FAIL_LOG"
            exit 1
          fi
          echo "MySQL 이중 적재 실패 없음"

      - name: 요약
        if: always()
        run: |
          {
            echo "## 주간 파생 지표 재계산"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| MySQL 내려받기 | ${{ steps.pull.outcome }} |"
            echo "| 잘린 경기 표 | ${{ steps.truncated.outcome }} |"
            echo "| 파크팩터 | ${{ steps.pf.outcome }} |"
            echo "| wRC+ | ${{ steps.wrc.outcome }} |"
            echo "| RE24 | ${{ steps.re24.outcome }} |"
            echo "| D1 적재 | ${{ steps.push.outcome }} |"
            echo "| 캐시 비우기 | ${{ steps.purge.outcome }} |"
            echo "| MySQL 이중 적재 | ${{ steps.mirror_check.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY
