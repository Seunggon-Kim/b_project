name: weekly

# 파크팩터·wRC+·RE24 를 다시 계산합니다.
# EC2 crontab 의 `park_factors/run_pipeline.sh` (매일 05:00 KST) 를 대신합니다.
#
# ## 왜 매일이 아니라 주 1회인가
#
# 이 계산은 `play_by_play` 전체를 훑습니다. Worker 에서는 못 합니다
# (10ms CPU 제한). 그래서 러너가 MySQL 에서 계산에 쓰는 표를 내려받아
# SQLite 를 만들고 기존 파이프라인을 그대로 돌립니다. 예전에는 D1 에서
# 받았는데, 12시즌이면 약 400만 행 읽기라 하루 무료 한도(500만)를 거의
# 다 썼습니다(2단계에서 바꿈). 파크팩터는 하루 새 경기 다섯 개로 소수점
# 아래가 흔들리는 정도라 주 1회면 충분합니다.
#
# 계산 결과는 Cloud SQL(MySQL)에만 씁니다. D1 은 2026-10-04 에 걷어냈습니다.
#
# ## 빅쿼리 사본
#
# 결과 표를 MySQL 에 올린 뒤, MySQL 의 모든 표를 빅쿼리 `bstats` 데이터셋
# (asia-northeast3)에 통째로 복사합니다(빅쿼리 복사 단계). 러너의 SQLite 에 받아
# 두고 바꾸지 않은 표(play_by_play 등)는 거기서 읽고, 나머지 표(위에서 다시 계산해
# 올린 결과 표 포함)는 MySQL 에서 바로 읽습니다(읽기만 합니다).
# 빅쿼리 EXTERNAL_QUERY 는 MySQL 8.4 를 읽지 못해서 이렇게 합니다. 정본은
# MySQL 이고 빅쿼리는 길게는 한 주 늦은 사본입니다. 복사가 실패해도 MySQL
# 적재는 그대로이고, 마지막 판정이 실행을 빨간색으로 끝냅니다.
#
# ## 필요한 시크릿
#
#   GCP_WIF_PROVIDER / GCP_LOADER_SA / CLOUDSQL_INSTANCE / MYSQL_LOADER_PASSWORD / MYSQL_SERVER_PUBKEY   MySQL 적재
#   ADMIN_TOKEN            적재 뒤 캐시 비우기

on:
  # 월요일 20:47 UTC = 화요일 05:47 KST. 일일 수집이 끝난 뒤입니다.
  # MySQL 에서 내려받아 계산합니다.
  schedule:
    - cron: '47 20 * * 1'
  workflow_dispatch:

concurrency:
  group: weekly-park-factors
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  API_BASE: https://kbo-api.bstats-baseball.workers.dev
  KBO_DB: /tmp/kbo_pipeline.db

jobs:
  park-factors:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pymysql cryptography google-cloud-bigquery pyarrow

      # 러너 디스크는 14GB 입니다. 12시즌 DB 가 1.3GB 라 들어갑니다.
      # 다만 여유를 확인하고 시작합니다.
      - name: 디스크 확인
        run: df -h /tmp | tail -1

      # 자격 파일을 만들고 GOOGLE_APPLICATION_CREDENTIALS 를 내보냅니다
      # (create_credentials_file 기본값 true). 프록시와 빅쿼리 복사가 씁니다.
      - name: GCP 인증(키 없음)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_LOADER_SA }}

      - name: MySQL 연결
        id: mysql
        env:
          CLOUDSQL_INSTANCE: ${{ secrets.CLOUDSQL_INSTANCE }}
          MYSQL_LOADER_PASSWORD: ${{ secrets.MYSQL_LOADER_PASSWORD }}
          MYSQL_SERVER_PUBKEY: ${{ secrets.MYSQL_SERVER_PUBKEY }}
        run: bash migration/mysql/ci_proxy.sh

      - name: MySQL 내려받기
        id: pull
        run: python -m migration.mysql.mysql_to_sqlite --out "$KBO_DB"

      # 원천에서 중간에 끊긴 경기를 가려 둡니다. 아래 세 계산이 이 표로 그 경기를
      # 뺍니다(park_factors/truncated.py). 2026-08-29 에 계산이 이 표를 쓰게 바뀌었는데
      # 만드는 단계가 없어 주간 작업이 첫 계산에서 계속 실패했습니다.
      - name: 잘린 경기 표 만들기
        id: truncated
        run: python park_factors/truncated.py

      - name: 파크팩터 계산
        id: pf
        if: ${{ steps.truncated.outcome == 'success' }}
        run: python park_factors/compute_self_park_factors.py

      # wOBA 가중치가 먼저 있어야 wRC+ 를 계산할 수 있습니다.
      # 예전에는 이 표를 손으로 채웠고(값은 Statiz 캡처), D1 으로
      # 넘어오지 않아 다음 단계가 첫 질의에서 죽었습니다. 그래서 이
      # 파이프라인이 한 번도 성공한 적이 없습니다.
      - name: wOBA 가중치 계산
        id: woba
        if: steps.pf.outcome == 'success'
        run: python park_factors/build_woba_weights.py --write

      - name: wRC+ 계산
        id: wrc
        if: steps.woba.outcome == 'success'
        run: python park_factors/build_wrc_plus.py

      - name: RE24·득점가치 계산
        id: re24
        if: steps.wrc.outcome == 'success'
        run: python park_factors/build_re24_run_values.py --write

      # 계산 결과를 MySQL 에 씁니다(sqlite_to_d1 의 mirror).
      - name: 결과 표 적재
        id: push
        if: steps.re24.outcome == 'success'
        run: python migration/sqlite_to_d1.py --db "$KBO_DB"

      # --- CSV 전량 내려받기: 멈춤 -------------------------------------
      # 2026-10-14 시행 KBO 이용약관 제14조 차항(재배포 금지)에 따라 GitHub
      # Releases(data-latest)에 전체 데이터 CSV 를 올리던 단계를 뺐습니다.
      # migration/export_csv.py 는 그대로 둡니다.

      - name: 캐시 비우기
        id: purge
        if: steps.push.outcome == 'success'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN 이 없어 캐시를 비우지 못합니다."
            exit 1
          fi
          code=$(curl -s -o /tmp/purge.txt -w '%{http_code}' -X POST \
            "$API_BASE/admin/purge-cache" -H "Authorization: Bearer $ADMIN_TOKEN")
          cat /tmp/purge.txt; echo
          test "$code" = "200"

      # MySQL 에 결과를 올린 뒤에만 돕니다. 캐시 단계가 실패해도 돕니다.
      # 실패해도 앞의 MySQL 적재는 그대로이고 뒤 단계도 계속 돕니다
      # (continue-on-error). 대신 마지막 "빅쿼리 복사 판정"이 실행을 빨갛게 끝냅니다.
      - name: 빅쿼리 복사
        id: bq_copy
        if: ${{ !cancelled() && steps.push.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        run: python -m migration.mysql.sqlite_to_bigquery --db "$KBO_DB"

      # --- 선수 소속(네이버 상세) ---------------------------------------
      # daily 는 올 시즌 1군 선수 목록으로만 소속을 맞춥니다. 1군 기록이 없는 선수의
      # 소속(네이버 선수 상세의 올해 팀, 은퇴 아님)은 여기서 한 주에 한 번 다시 봅니다
      # (evan 결정 2026-10-18). team_id 만 고칩니다. 네이버 호출은 1.1초 간격이고
      # 선수 800명 안팎이면 15분쯤 걸립니다. 상세 캐시는 다음 주에 은퇴 여부를 보려고 둡니다.
      - name: 선수 상세 캐시
        if: ${{ !cancelled() && steps.mysql.outcome == 'success' }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/naver_players
          key: naver-players-${{ github.run_id }}
          restore-keys: naver-players-

      - name: 선수 소속(네이버 상세)
        id: players_team
        if: ${{ !cancelled() && steps.mysql.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 40
        run: |
          python data_collection/naver_players.py --refresh-teams \
            --detail-cache "$RUNNER_TEMP/naver_players"

      - name: 선수 소속 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job players_team \
            --status ${{ steps.players_team.outcome == 'success' && 'ok' || (steps.players_team.outcome == 'skipped' && 'skip' || 'fail') }}

      - name: 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job park_factors \
            --status ${{ steps.push.outcome == 'success' && 'ok' || 'fail' }} \
            --note "내려받기 ${{ steps.pull.outcome }} / 계산 ${{ steps.re24.outcome }}"

      # 복사하지 못한 주(앞 단계 실패로 건너뜀 포함)도 fail 로 남깁니다. 빅쿼리가
      # 그 주에 갱신되지 않았다는 뜻입니다. 메모는 복사 단계가 남긴 표·행 수입니다
      # (meta_job_runs.note 가 128자라 스크립트가 줄이고, record_job_run 도 자릅니다).
      - name: 빅쿼리 복사 기록
        if: always()
        continue-on-error: true
        env:
          NOTE: ${{ steps.bq_copy.outputs.note || format('빅쿼리 복사 {0}', steps.bq_copy.outcome) }}
        run: |
          python data_collection/record_job_run.py --job bq_copy \
            --status ${{ steps.bq_copy.outcome == 'success' && 'ok' || 'fail' }} \
            --note "$NOTE"

      - name: MySQL 적재 실패 확인
        id: mirror_check
        if: ${{ always() && steps.mysql.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -s "$BSTATS_MYSQL_FAIL_LOG" ]; then
            echo "MySQL 에 쓰지 못한 작업이 있습니다:"
            cat "$BSTATS_MYSQL_FAIL_LOG"
            exit 1
          fi
          echo "MySQL 적재 실패 없음"

      - name: 요약
        if: always()
        run: |
          {
            echo "## 주간 파생 지표 재계산"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| MySQL 내려받기 | ${{ steps.pull.outcome }} |"
            echo "| 잘린 경기 표 | ${{ steps.truncated.outcome }} |"
            echo "| 파크팩터 | ${{ steps.pf.outcome }} |"
            echo "| wRC+ | ${{ steps.wrc.outcome }} |"
            echo "| RE24 | ${{ steps.re24.outcome }} |"
            echo "| 결과 표 적재 | ${{ steps.push.outcome }} |"
            echo "| 캐시 비우기 | ${{ steps.purge.outcome }} |"
            echo "| 빅쿼리 복사 | ${{ steps.bq_copy.outcome }} |"
            echo "| 선수 소속(네이버 상세) | ${{ steps.players_team.outcome }} |"
            echo "| MySQL 적재 | ${{ steps.mirror_check.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY

      - name: MySQL 적재 판정
        if: ${{ always() && (steps.mysql.outcome != 'success' || steps.mirror_check.outcome != 'success') }}
        run: |
          echo "MySQL 연결 또는 적재가 실패했습니다. 요약 표를 보십시오."
          exit 1

      - name: 선수 소속 판정
        if: ${{ always() && steps.players_team.outcome == 'failure' }}
        run: |
          echo "선수 소속(네이버 상세) 갱신이 실패했습니다. MySQL 적재·빅쿼리 복사와는 따로입니다."
          exit 1

      - name: 빅쿼리 복사 판정
        if: ${{ always() && steps.bq_copy.outcome == 'failure' }}
        run: |
          echo "빅쿼리 복사가 실패했습니다. MySQL 적재는 끝났습니다. 빅쿼리 복사 단계 기록을 보십시오."
          exit 1
