name: daily

# 매일 도는 수집입니다. EC2 crontab 의 02:00~05:40 KST 작업들을 대신합니다.
#
# ## cron 은 정각을 피합니다
#
# GitHub 문서가 "높은 부하 시간대에 지연될 수 있고 매 시각 정각이 특히
# 그렇다"고 명시합니다. 그래서 33분에 둡니다. 그래도 몇십 분 늦을 수
# 있습니다. 정시성이 필요한 작업을 여기 넣지 마십시오.
#
# ## 60일 자동 비활성화
#
# 공개 저장소는 60일간 활동이 없으면 스케줄 워크플로가 꺼집니다.
# 매일 실행 자체가 활동으로 잡히는지 확실치 않으므로, 실패하면 워크플로가
# 빨간색으로 끝나게 두어 알림을 받으십시오(마지막 단계).
#
# ## 저장소
#
# 수집은 Cloud SQL(MySQL)에만 씁니다. D1 은 2026-10-04 에 걷어냈습니다.
#
# ## 필요한 시크릿
#
#   GCP_WIF_PROVIDER / GCP_LOADER_SA / CLOUDSQL_INSTANCE / MYSQL_LOADER_PASSWORD / MYSQL_SERVER_PUBKEY   MySQL 적재
#   ADMIN_TOKEN            적재 뒤 캐시 비우기 (Worker 시크릿과 같은 값)

on:
  # 18:33 UTC = 03:33 KST. 전날 경기가 모두 끝난 뒤입니다.
  schedule:
    - cron: '33 18 * * *'
  workflow_dispatch:

# 앞 실행이 아직 돌고 있으면 겹치지 않게 합니다. 같은 날짜를 두 번
# 넣어도 멱등이지만, 같은 쓰기를 두 번 할 이유가 없습니다.
concurrency:
  group: daily-collect
  cancel-in-progress: false

# id-token 은 GCP 키 없는 인증(Workload Identity Federation)에 필요합니다.
permissions:
  contents: read
  id-token: write

env:
  API_BASE: https://kbo-api.bstats-baseball.workers.dev

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # tqdm 은 `crawler/download.py` 가 씁니다. PBP 수집이 크롤러를
      # **subprocess 로** 부르기 때문에, import 를 따라가는 방식으로는
      # 이 의존성이 보이지 않습니다. 그래서 처음부터 빠져 있었고
      # 러너에서만 ModuleNotFoundError 로 죽었습니다. 로컬에는 깔려
      # 있어서 재현도 안 됐습니다.
      # selenium·webdriver-manager 를 뺐습니다. 공식 기록 수집이 HTTP 로
      # 바뀌어 브라우저가 필요 없습니다. chromedriver 내려받기가 사라져
      # 설치도 실행도 빨라집니다.
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml requests pandas tqdm pymysql cryptography

      # --- MySQL 연결 ---------------------------------------------------
      # MySQL 이 유일한 저장소라 붙지 못하면 여기서 바로 멈춥니다(뒤 수집이
      # 쓸 곳이 없음). 아래 always() 단계(결과 기록·요약·실패 판정)는 돌고,
      # 실패 판정이 빨갛게 끝냅니다.
      - name: GCP 인증(키 없음)
        id: gcp
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_LOADER_SA }}

      - name: MySQL 연결
        id: mysql
        env:
          CLOUDSQL_INSTANCE: ${{ secrets.CLOUDSQL_INSTANCE }}
          MYSQL_LOADER_PASSWORD: ${{ secrets.MYSQL_LOADER_PASSWORD }}
          MYSQL_SERVER_PUBKEY: ${{ secrets.MYSQL_SERVER_PUBKEY }}
        run: bash migration/mysql/ci_proxy.sh

      # --- 1. 어제 경기 PBP (원래 03:30 KST) -------------------------
      - name: PBP 수집·적재
        id: pbp
        continue-on-error: true
        run: python data_collection/daily_pbp_to_d1.py

      - name: PBP 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job pbp \
            --status ${{ steps.pbp.outcome == 'success' && 'ok' || 'fail' }}

      # --- 2. 경기 메타 (PBP 가 있어야 도출됩니다) --------------------
      # PBP 만 넣고 이걸 빠뜨리면 새 경기가 화면에 안 나옵니다.
      - name: games 적재
        id: games
        if: steps.pbp.outcome == 'success'
        continue-on-error: true
        run: python data_collection/daily_games_to_d1.py

      - name: games 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job games \
            --status ${{ steps.games.outcome == 'success' && 'ok' || (steps.games.outcome == 'skipped' && 'skip' || 'fail') }}

      # --- 2-3. 구종 가치 ---------------------------------------------
      # 올 시즌 정규시즌 PBP 로 기대 득점 표(주자×아웃×볼카운트)와 투수 ×
      # 구종 × 타자 손별 구종 가치를 다시 만듭니다(MySQL run_expectancy·
      # pitch_run_value, 시즌 단위로 지우고 넣음). 선수 분석 화면이 읽습니다.
      # 설계: docs/superpowers/specs/2026-10-04-pitch-run-value-design.md
      - name: 구종 가치 계산
        id: pitch_values
        continue-on-error: true
        run: python data_collection/pitch_run_value.py --current

      - name: 구종 가치 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job pitch_values \
            --status ${{ steps.pitch_values.outcome == 'success' && 'ok' || (steps.pitch_values.outcome == 'skipped' && 'skip' || 'fail') }}

      # --- KBO 사이트 수집: 멈춤, 네이버로 대신함 ---------------------
      # 2026-10-14 시행 KBO 이용약관 제14조 차항(크롤링 등 자동화 수집 금지)에
      # 따라 KBO 사이트(koreabaseball.com)를 읽는 단계를 뺐습니다: 퓨처스 일정,
      # 올 시즌 팀 순위, 공식 타자·투수 기록, 1군 등록 현황, players 소속·등번호
      # 갱신, 새 선수 추가. 수집 스크립트는 data_collection/ 에 그대로 둡니다.
      # 팀 순위·공식 기록·선수 정보는 아래 세 단계가 네이버 스포츠 API 로
      # 대신합니다(계획서 docs/superpowers/plans/2026-10-18-naver-official-stats.md).
      # 퓨처스·1군 등록 명단은 네이버에 없어 대신하지 않습니다.

      # --- 3-1. 팀 순위(네이버) ---------------------------------------
      - name: 팀 순위(네이버)
        id: team_ranks
        continue-on-error: true
        run: python data_collection/naver_team_ranks.py --current

      - name: 팀 순위 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job team_ranks \
            --status ${{ steps.team_ranks.outcome == 'success' && 'ok' || 'fail' }}

      # --- 3-2. 공식 기록(네이버 시즌 API + 박스스코어 + PBP) -------------
      # 박스스코어는 경기마다 한 번만 받습니다. 받은 파일을 캐시에 두고 다음
      # 실행이 이어 씁니다(새 경기만 받음). 캐시가 비면 올 시즌 전체를 다시
      # 받습니다(정규시즌 720경기, 호출 시작 간격 1.1초, 약 15분).
      - name: 박스스코어 캐시
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/naver_boxscore
          key: naver-box-${{ github.run_id }}
          restore-keys: naver-box-

      - name: 공식 기록(네이버)
        id: official_stats
        if: steps.pbp.outcome == 'success'
        continue-on-error: true
        run: |
          python data_collection/naver_official_stats.py --current --fetch-box \
            --box-dir "$RUNNER_TEMP/naver_boxscore"

      - name: 공식 기록 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job official_stats \
            --status ${{ steps.official_stats.outcome == 'success' && 'ok' || (steps.official_stats.outcome == 'skipped' && 'skip' || 'fail') }}

      # --- 3-3. 새 선수·소속(네이버) ----------------------------------
      # 올 시즌 PBP 에 처음 나온 선수를 네이버 선수 상세로 넣고, 올 시즌 선수
      # 목록의 소속으로 players.team_id 를 맞춥니다.
      - name: 새 선수·소속(네이버)
        id: players
        if: steps.pbp.outcome == 'success'
        continue-on-error: true
        run: python data_collection/naver_players.py --new

      - name: 새 선수 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job add_new_players \
            --status ${{ steps.players.outcome == 'success' && 'ok' || (steps.players.outcome == 'skipped' && 'skip' || 'fail') }}

      # --- 4. 옛 시즌 PBP 되채우기 (2008~2014): 끝남---------------------
      # 2026-08-29 에 두 커서 모두 마지막 경기까지 넣어 단계를 뺐습니다.
      # 그때 쓴 되채우기 도구(migration/shard_backfill.py)는 D1 전용이라
      # 2026-10-04 에 지웠습니다.

      # --- 5. 캐시 비우기 ---------------------------------------------
      # 이걸 빠뜨리면 적재해도 최대 한 시간 동안 화면이 어제 숫자를
      # 보여 줍니다. 2026 시즌을 넣었을 때 실제로 겪은 문제입니다.
      - name: 캐시 비우기
        id: purge
        if: always()
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN 이 없어 캐시를 비우지 못합니다."
            echo "화면이 갱신될 때까지 잠시 옛 값을 보여 줍니다."
            exit 1
          fi
          code=$(curl -s -o /tmp/purge.txt -w '%{http_code}' -X POST \
            "$API_BASE/admin/purge-cache" -H "Authorization: Bearer $ADMIN_TOKEN")
          cat /tmp/purge.txt; echo
          if [ "$code" != "200" ]; then
            # 401 이 나면 값이 틀린 것인지 잘린 것인지 구분해야 합니다.
            # **길이만** 찍습니다. 값 자체나 앞자리를 찍으면 공개
            # 저장소 로그에 시크릿이 남습니다.
            #
            # 붙여 넣을 때 앞뒤 공백·줄바꿈이 섞이면 길이가 어긋납니다.
            # 실제로 한 번 401 로 실패했고, 그때 이 정보가 없어 원인을
            # 좁히지 못했습니다.
            echo "HTTP $code"
            echo "받은 ADMIN_TOKEN 길이: ${#ADMIN_TOKEN}자 (Worker 쪽과 같아야 합니다)"
            case "$ADMIN_TOKEN" in
              *[![:print:]]*) echo "경고: 출력 불가 문자가 섞여 있습니다(줄바꿈 등)." ;;
              " "*|*" ") echo "경고: 앞뒤에 공백이 있습니다." ;;
            esac
            exit 1
          fi

      # --- 6. 결과 요약 ------------------------------------------------
      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-output
          path: |
            logs/
            log.txt
          if-no-files-found: warn
          retention-days: 7

      # 수집 단계는 MySQL 쓰기가 실패하면 그 자리에서 실패합니다. 그래도 이
      # 확인을 둡니다. 실패 기록 파일이 어느 작업이 못 썼는지 모아 보여 주고,
      # 아래 실패 판정에 넣지 않은 단계의 MySQL 실패도 잡습니다.
      - name: MySQL 적재 실패 확인
        id: mirror_check
        if: ${{ always() && steps.mysql.outcome == 'success' }}
        continue-on-error: true
        run: |
          if [ -s "$BSTATS_MYSQL_FAIL_LOG" ]; then
            echo "MySQL 에 쓰지 못한 작업이 있습니다:"
            cat "$BSTATS_MYSQL_FAIL_LOG"
            exit 1
          fi
          echo "MySQL 적재 실패 없음"

      - name: 요약
        if: always()
        run: |
          {
            echo "## 일일 수집 결과"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| PBP 수집·적재 | ${{ steps.pbp.outcome }} |"
            echo "| games 적재 | ${{ steps.games.outcome }} |"
            echo "| 구종 가치 계산 | ${{ steps.pitch_values.outcome }} |"
            echo "| 팀 순위(네이버) | ${{ steps.team_ranks.outcome }} |"
            echo "| 공식 기록(네이버) | ${{ steps.official_stats.outcome }} |"
            echo "| 새 선수·소속(네이버) | ${{ steps.players.outcome }} |"
            echo "| 캐시 비우기 | ${{ steps.purge.outcome }} |"
            echo "| MySQL 연결 | ${{ steps.mysql.outcome }} |"
            echo "| MySQL 적재 | ${{ steps.mirror_check.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY

      # 실패를 초록색으로 덮지 않습니다. 조용히 멈춘 수집을 몇 주 뒤에
      # 발견하는 것이 이 이관에서 가장 큰 위험입니다.
      - name: 실패 판정
        if: always()
        run: |
          fail=0
          for s in "${{ steps.pbp.outcome }}" "${{ steps.purge.outcome }}" \
                   "${{ steps.pitch_values.outcome }}" "${{ steps.team_ranks.outcome }}"; do
            if [ "$s" != "success" ]; then fail=1; fi
          done
          # games 는 경기가 없는 날 건너뛰므로 skipped 를 실패로 보지 않습니다.
          if [ "${{ steps.games.outcome }}" = "failure" ]; then fail=1; fi
          # 공식 기록·새 선수는 PBP 가 실패하면 건너뜁니다(그때는 PBP 가 빨갛게 합니다).
          for s in "${{ steps.official_stats.outcome }}" "${{ steps.players.outcome }}"; do
            if [ "$s" = "failure" ]; then fail=1; fi
          done
          # MySQL 연결·적재는 늘 성공해야 합니다(사이트가 MySQL 을 읽습니다).
          for s in "${{ steps.mysql.outcome }}" "${{ steps.mirror_check.outcome }}"; do
            if [ "$s" != "success" ]; then fail=1; fi
          done
          if [ "$fail" = "1" ]; then
            echo "위 표에서 success 가 아닌 단계를 보십시오."
            exit 1
          fi
          echo "모두 통과했습니다."
