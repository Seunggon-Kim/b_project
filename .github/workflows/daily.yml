name: daily

# 정기 실행은 계획 D 에서 추가합니다.
#
# workflow_dispatch 는 워크플로 파일이 기본 브랜치에 있어야 트리거됩니다.
# 지금은 작업 브랜치에만 있어 UI 버튼이 뜨지 않으므로, 위험 1 을 판정할 동안만
# push 트리거를 함께 둡니다. 관련 파일이 바뀔 때만 돌도록 paths 로 좁혔습니다.
# main 에 합치면서 push 트리거는 제거합니다.
on:
  workflow_dispatch:
  push:
    branches:
      - feat/cloudflare-migration
    paths:
      - '.github/workflows/daily.yml'
      - '.github/scripts/probe_kbo.py'
      - 'data_collection/selenium_batter_scraper.py'

jobs:
  official-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 lxml requests pandas

      # 위험 1 판정의 핵심입니다. 여기서 막히면 뒤 단계는 볼 것도 없습니다.
      - name: KBO 도달 확인 (HTTP)
        id: http_probe
        continue-on-error: true
        run: python .github/scripts/probe_kbo.py --mode http

      # HTTP 는 되는데 이것만 실패하면 브라우저 지문 탐지입니다.
      # 전체 수집(10팀)은 오래 걸리므로 표가 그려지는지만 먼저 봅니다.
      - name: KBO 도달 확인 (Selenium)
        id: selenium_probe
        continue-on-error: true
        run: python .github/scripts/probe_kbo.py --mode selenium

      # Cloudflare 엣지에서는 구글이 막혔지만(설계 §7 위험 2) 러너에서는
      # 5/5 정상 응답합니다. 그 전제가 유지되는지 매번 확인합니다.
      - name: 구글 뉴스 도달 확인
        id: google_probe
        continue-on-error: true
        run: python .github/scripts/probe_kbo.py --mode google-news

      # 선수 뉴스를 모아 D1 적재용 SQL 을 만듭니다.
      # Worker 는 구글을 부르지 못하므로 여기서 미리 모아 둡니다.
      #
      # 선수 목록은 D1 에서 읽습니다. 러너에는 database/kbo_stats.db 가
      # 없습니다. 127MB 라 git 에 두지 않기 때문입니다. 그래서 이 단계도
      # Cloudflare 인증이 필요합니다.
      - name: 선수 뉴스 수집
        id: news
        if: steps.google_probe.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python data_collection/collect_player_news.py --source d1

      - name: 선수 뉴스 D1 적재
        id: news_load
        if: steps.news.outcome == 'success'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 이 없어 적재를 건너뜁니다."
            echo "저장소 Settings > Secrets 에 등록하면 이 단계가 동작합니다."
            exit 1
          fi
          npx --yes wrangler@4 d1 execute kbo-stats --remote \
            --file=migration/out/news.sql --yes

      - name: 타자 기록 수집
        id: scrape
        continue-on-error: true
        run: python data_collection/selenium_batter_scraper.py

      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-stats-output
          path: |
            logs/
            crawler/save/official_stats/
          if-no-files-found: warn

      - name: 판정 요약
        if: always()
        run: |
          echo "## 위험 1 판정" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 단계 | 결과 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP 도달 | ${{ steps.http_probe.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Selenium 도달 | ${{ steps.selenium_probe.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 구글 뉴스 도달 | ${{ steps.google_probe.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 선수 뉴스 수집 | ${{ steps.news.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 선수 뉴스 D1 적재 | ${{ steps.news_load.outcome }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 전체 수집 | ${{ steps.scrape.outcome }} |" >> $GITHUB_STEP_SUMMARY

      # 판정 결과를 실패로 드러내야 로그를 놓치지 않습니다.
      - name: 판정 실패 시 종료 코드
        if: always()
        run: |
          if [ "${{ steps.http_probe.outcome }}" != "success" ]; then
            echo "HTTP 도달에 실패했습니다. 설계 7장 위험 1 의 사다리 2번(Cloudflare Worker)으로 넘어갑니다."
            exit 1
          fi
          if [ "${{ steps.selenium_probe.outcome }}" != "success" ]; then
            echo "HTTP 는 되는데 Selenium 이 실패했습니다. HTTP 직접 호출 전환을 즉시 과제로 올립니다."
            exit 1
          fi
          if [ "${{ steps.scrape.outcome }}" != "success" ]; then
            echo "프로브는 통과했으나 전체 수집이 실패했습니다. 접근 문제가 아니라 스크래퍼 쪽 문제입니다."
            exit 1
          fi
          echo "세 단계 모두 통과했습니다."
