name: daily

# 매일 도는 수집입니다. EC2 crontab 의 02:00~05:40 KST 작업들을 대신합니다.
#
# ## cron 은 정각을 피합니다
#
# GitHub 문서가 "높은 부하 시간대에 지연될 수 있고 매 시각 정각이 특히
# 그렇다"고 명시합니다. 그래서 33분에 둡니다. 그래도 몇십 분 늦을 수
# 있습니다. 정시성이 필요한 작업을 여기 넣지 마십시오.
#
# ## 60일 자동 비활성화
#
# 공개 저장소는 60일간 활동이 없으면 스케줄 워크플로가 꺼집니다.
# 매일 실행 자체가 활동으로 잡히는지 확실치 않으므로, 실패하면 워크플로가
# 빨간색으로 끝나게 두어 알림을 받으십시오(마지막 단계).
#
# ## 필요한 시크릿
#
#   CLOUDFLARE_API_TOKEN   D1 적재
#   CLOUDFLARE_ACCOUNT_ID  D1 적재
#   ADMIN_TOKEN            적재 뒤 캐시 비우기 (Worker 시크릿과 같은 값)

on:
  # 18:33 UTC = 03:33 KST. 전날 경기가 모두 끝난 뒤입니다.
  schedule:
    - cron: '33 18 * * *'
  workflow_dispatch:

# 앞 실행이 아직 돌고 있으면 겹치지 않게 합니다. 같은 날짜를 두 번
# 넣어도 멱등이지만, D1 쓰기를 두 배로 쓸 이유가 없습니다.
concurrency:
  group: daily-collect
  cancel-in-progress: false

env:
  API_BASE: https://kbo-api.bstats-baseball.workers.dev

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # tqdm 은 `crawler/download.py` 가 씁니다. PBP 수집이 크롤러를
      # **subprocess 로** 부르기 때문에, import 를 따라가는 방식으로는
      # 이 의존성이 보이지 않습니다. 그래서 처음부터 빠져 있었고
      # 러너에서만 ModuleNotFoundError 로 죽었습니다. 로컬에는 깔려
      # 있어서 재현도 안 됐습니다.
      # selenium·webdriver-manager 를 뺐습니다. 공식 기록 수집이 HTTP 로
      # 바뀌어 브라우저가 필요 없습니다. chromedriver 내려받기가 사라져
      # 설치도 실행도 빨라집니다.
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml requests pandas tqdm

      # 토큰이 없으면 수집만 하고 아무것도 안 남습니다. 시간만 쓰고
      # 끝나므로 먼저 막습니다.
      - name: 인증 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 이 없습니다."
            echo "Settings > Secrets and variables > Actions 에 등록하십시오."
            exit 1
          fi
          npx --yes wrangler@4 d1 info kbo-stats > /dev/null
          echo "D1 접근 확인"

      # --- 1. 어제 경기 PBP (원래 03:30 KST) -------------------------
      - name: PBP 수집·적재
        id: pbp
        continue-on-error: true
        run: python data_collection/daily_pbp_to_d1.py

      - name: PBP 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job pbp \
            --status ${{ steps.pbp.outcome == 'success' && 'ok' || 'fail' }}

      # --- 2. 경기 메타 (PBP 가 있어야 도출됩니다) --------------------
      # PBP 만 넣고 이걸 빠뜨리면 새 경기가 화면에 안 나옵니다.
      - name: games 적재
        id: games
        if: steps.pbp.outcome == 'success'
        continue-on-error: true
        run: python data_collection/daily_games_to_d1.py

      - name: games 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job games \
            --status ${{ steps.games.outcome == 'success' && 'ok' || (steps.games.outcome == 'skipped' && 'skip' || 'fail') }}

      # --- 2-1. 퓨처스 일정 -------------------------------------------
      # EC2 는 30분마다 돌렸습니다. 그럴 필요가 없습니다. 화면의 퓨처스
      # 일정(`/schedule/futures`)은 Worker 가 KBO 스코어보드를 그때그때
      # 프록시하므로 이 표를 읽지 않습니다. `futures_games` 는 분석용
      # 창고라서 하루 한 번이면 충분합니다.
      - name: 퓨처스 일정 적재
        id: futures
        continue-on-error: true
        run: python data_collection/futures_to_d1.py

      - name: 퓨처스 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job futures \
            --status ${{ steps.futures.outcome == 'success' && 'ok' || 'fail' }}

      # --- 3. KBO 공식 통계 (원래 02:00 KST) --------------------------
      # Selenium 으로 KBO 사이트를 읽습니다. 러너 IP 가 막히면 여기서
      # 실패합니다(설계 7장 위험 1).
      # 브라우저를 걷어냈습니다. Selenium 은 13분을 쓰고, 브라우저에서만
      # 나는 고장이 있었습니다. 상단 고정 메뉴바가 '다음' 링크를 가려
      # 2021 NC 49명의 볼넷·사구·삼진이 통째로 빈 적이 있습니다.
      # HTTP 는 2분이고 좌표도 겹침도 없습니다. 2021 로 대조해
      # 타자 394명 37컬럼, 투수 308명 51컬럼이 전부 일치했습니다.
      - name: 타자 기록 수집
        id: scrape_batter
        continue-on-error: true
        run: python data_collection/official_stats_http.py --kind batter

      - name: 타자 기록 D1 적재
        id: load_batter
        if: steps.scrape_batter.outcome == 'success'
        continue-on-error: true
        run: |
          python data_collection/csv_to_d1.py \
            --table kbo_official_batter_stats \
            --csv "crawler/save/official_stats/batter_stats_$(TZ=Asia/Seoul date +%Y).csv" \
            --key player_id,season

      - name: 투수 기록 수집
        id: scrape_pitcher
        continue-on-error: true
        run: python data_collection/official_stats_http.py --kind pitcher

      - name: 투수 기록 D1 적재
        id: load_pitcher
        if: steps.scrape_pitcher.outcome == 'success'
        continue-on-error: true
        run: |
          python data_collection/csv_to_d1.py \
            --table kbo_official_pitcher_stats \
            --csv "crawler/save/official_stats/pitcher_stats_$(TZ=Asia/Seoul date +%Y).csv" \
            --key player_id,season

      - name: 공식 통계 결과 기록
        if: always()
        continue-on-error: true
        run: |
          if [ "${{ steps.load_batter.outcome }}" = "success" ] && [ "${{ steps.load_pitcher.outcome }}" = "success" ]; then
            S=ok
          else
            S=fail
          fi
          python data_collection/record_job_run.py --job official_stats --status $S \
            --note "타자 ${{ steps.load_batter.outcome }} / 투수 ${{ steps.load_pitcher.outcome }}"

      # --- 5. 캐시 비우기 ---------------------------------------------
      # 이걸 빠뜨리면 적재해도 최대 한 시간 동안 화면이 어제 숫자를
      # 보여 줍니다. 2026 시즌을 넣었을 때 실제로 겪은 문제입니다.
      - name: 캐시 비우기
        id: purge
        if: always()
        continue-on-error: true
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN 이 없어 캐시를 비우지 못합니다."
            echo "화면이 갱신될 때까지 잠시 옛 값을 보여 줍니다."
            exit 1
          fi
          code=$(curl -s -o /tmp/purge.txt -w '%{http_code}' -X POST \
            "$API_BASE/admin/purge-cache" -H "Authorization: Bearer $ADMIN_TOKEN")
          cat /tmp/purge.txt; echo
          if [ "$code" != "200" ]; then
            # 401 이 나면 값이 틀린 것인지 잘린 것인지 구분해야 합니다.
            # **길이만** 찍습니다. 값 자체나 앞자리를 찍으면 공개
            # 저장소 로그에 시크릿이 남습니다.
            #
            # 붙여 넣을 때 앞뒤 공백·줄바꿈이 섞이면 길이가 어긋납니다.
            # 실제로 한 번 401 로 실패했고, 그때 이 정보가 없어 원인을
            # 좁히지 못했습니다.
            echo "HTTP $code"
            echo "받은 ADMIN_TOKEN 길이: ${#ADMIN_TOKEN}자 (Worker 쪽과 같아야 합니다)"
            case "$ADMIN_TOKEN" in
              *[![:print:]]*) echo "경고: 출력 불가 문자가 섞여 있습니다(줄바꿈 등)." ;;
              " "*|*" ") echo "경고: 앞뒤에 공백이 있습니다." ;;
            esac
            exit 1
          fi

      # --- 6. 결과 요약 ------------------------------------------------
      - name: 산출물 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-output
          path: |
            logs/
            crawler/save/official_stats/
            log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: 요약
        if: always()
        run: |
          {
            echo "## 일일 수집 결과"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| PBP 수집·적재 | ${{ steps.pbp.outcome }} |"
            echo "| games 적재 | ${{ steps.games.outcome }} |"
            echo "| 타자 수집 | ${{ steps.scrape_batter.outcome }} |"
            echo "| 타자 적재 | ${{ steps.load_batter.outcome }} |"
            echo "| 투수 수집 | ${{ steps.scrape_pitcher.outcome }} |"
            echo "| 투수 적재 | ${{ steps.load_pitcher.outcome }} |"
            echo "| 캐시 비우기 | ${{ steps.purge.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY

      # 실패를 초록색으로 덮지 않습니다. 조용히 멈춘 수집을 몇 주 뒤에
      # 발견하는 것이 이 이관에서 가장 큰 위험입니다.
      - name: 실패 판정
        if: always()
        run: |
          fail=0
          for s in "${{ steps.pbp.outcome }}" "${{ steps.load_batter.outcome }}" \
                   "${{ steps.load_pitcher.outcome }}" "${{ steps.purge.outcome }}"; do
            if [ "$s" != "success" ]; then fail=1; fi
          done
          # games 는 경기가 없는 날 건너뛰므로 skipped 를 실패로 보지 않습니다.
          if [ "${{ steps.games.outcome }}" = "failure" ]; then fail=1; fi
          if [ "$fail" = "1" ]; then
            echo "위 표에서 success 가 아닌 단계를 보십시오."
            exit 1
          fi
          echo "모두 통과했습니다."
