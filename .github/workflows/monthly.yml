name: monthly

# 선수 상세 프로필을 전체 다시 수집합니다.
# EC2 crontab 의 `player_info_scraper.py` (매월 1일 13:00 KST) 를 대신합니다.
#
# 585명 × sleep 2초라 40~90분 걸립니다. 러너 작업 한도는 6시간이라
# 여유가 있습니다.
#
# 러너에는 로컬 DB 가 없으므로 D1 에서 `players` 만 받아 임시 SQLite 를
# 만들고, 스크립트에 `KBO_DB` 로 그 경로를 넘긴 뒤, 끝나면 되돌립니다.
#
# ## 필요한 시크릿
#
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / ADMIN_TOKEN

on:
  # 매월 1일 04:13 UTC = 13:13 KST. 원래 시각과 같습니다.
  schedule:
    - cron: '13 4 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-player-info
  cancel-in-progress: false

env:
  API_BASE: https://kbo-api.bstats-baseball.workers.dev
  KBO_DB: /tmp/kbo_players.db

jobs:
  player-info:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # pandas 는 player_info_scraper.py 가 씁니다. 빠져 있어서 이
      # 워크플로도 첫 단계에서 죽었습니다(meta_job_runs 에 player_info
      # 기록이 없는 이유 중 하나입니다).
      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 lxml requests pandas

      - name: 인증 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 이 없습니다."
            exit 1
          fi
          npx --yes wrangler@4 d1 info kbo-stats > /dev/null

      # players 와 공식 기록 두 표만 받습니다. play_by_play 는 이 작업에
      # 필요 없고, 받으면 읽기 한도만 크게 씁니다.
      #
      # **공식 기록 두 표가 있어야 합니다.** player_info_scraper 가 수집
      # 대상 선수 명단을 거기서 뽑습니다(get_existing_player_ids).
      # 예전에는 `--tables players` 만 받아서 그 질의가 "no such table" 로
      # 죽었습니다. meta_job_runs 에 player_info 기록이 한 번도 없는
      # 이유입니다. 두 표는 합쳐 7천 행 남짓이라 비용은 무시할 수준입니다.
      - name: players·공식기록 내려받기
        id: pull
        run: |
          python migration/d1_to_sqlite.py --out "$KBO_DB" \
            --tables players,kbo_official_batter_stats,kbo_official_pitcher_stats

      # `--refresh` 가 없으면 이미 players 에 있는 선수를 통째로
      # 건너뜁니다. 2026-08-28 실행은 1,749명 중 4명만 처리했습니다.
      # 그래서 이적한 선수의 소속·연봉·경력이 옛 값으로 남았습니다
      # (최원준이 KT 인데 경력이 '...-KIA-상무-KIA').
      #
      # 대상은 올 시즌 기록이 있는 선수 567명이라 30분쯤 걸립니다.
      # 이 job 한도는 300분이고 저장소가 공개라 Actions 시간은 무료입니다.
      - name: 선수 프로필 수집
        id: scrape
        run: python data_collection/player_info_scraper.py --refresh

      - name: players D1 적재
        id: push
        if: steps.scrape.outcome == 'success'
        run: python migration/sqlite_to_d1.py --db "$KBO_DB" --tables players

      # 선수 사진 주소를 최신 연도로 맞춥니다.
      #
      # `players.image_url` 은 KBO 이미지 주소를 통째로 담는데 그 안에
      # 연도 폴더가 있습니다. 위 수집이 그 값을 채우지만 1,749명 중
      # 625명이 2025년 주소로 남아 있었습니다. 겨울에 이적한 선수는
      # 전 소속팀 유니폼 사진이 나옵니다(최원준이 KT 인데 NC 사진).
      #
      # 이 단계는 현재 시즌 주소를 찔러 보고 있으면 바꿔 놓습니다.
      # 선수 한 명에 요청 두 번을 넘기지 않습니다.
      - name: 선수 사진 주소 보정
        id: photos
        continue-on-error: true
        timeout-minutes: 20
        run: python data_collection/heal_player_photos.py

      - name: 캐시 비우기
        id: purge
        if: steps.push.outcome == 'success'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN 이 없어 캐시를 비우지 못합니다."
            exit 1
          fi
          code=$(curl -s -o /tmp/purge.txt -w '%{http_code}' -X POST \
            "$API_BASE/admin/purge-cache" -H "Authorization: Bearer $ADMIN_TOKEN")
          cat /tmp/purge.txt; echo
          test "$code" = "200"

      - name: 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job player_info \
            --status ${{ steps.push.outcome == 'success' && 'ok' || 'fail' }} \
            --note "수집 ${{ steps.scrape.outcome }}"

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: player-info-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 요약
        if: always()
        run: |
          {
            echo "## 월간 선수 프로필 재수집"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| players 내려받기 | ${{ steps.pull.outcome }} |"
            echo "| 프로필 수집 | ${{ steps.scrape.outcome }} |"
            echo "| D1 적재 | ${{ steps.push.outcome }} |"
            echo "| 선수 사진 주소 보정 | ${{ steps.photos.outcome }} |"
            echo "| 캐시 비우기 | ${{ steps.purge.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY
