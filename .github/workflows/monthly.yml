name: monthly

# 선수 상세 프로필을 전체 다시 수집합니다.
# EC2 crontab 의 `player_info_scraper.py` (매월 1일 13:00 KST) 를 대신합니다.
#
# 585명 × sleep 2초라 40~90분 걸립니다. 러너 작업 한도는 6시간이라
# 여유가 있습니다.
#
# 러너에는 로컬 DB 가 없으므로 D1 에서 `players` 만 받아 임시 SQLite 를
# 만들고, 스크립트에 `KBO_DB` 로 그 경로를 넘긴 뒤, 끝나면 되돌립니다.
#
# ## 필요한 시크릿
#
#   CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID / ADMIN_TOKEN

on:
  # 매월 1일 04:13 UTC = 13:13 KST. 원래 시각과 같습니다.
  schedule:
    - cron: '13 4 1 * *'
  workflow_dispatch:

concurrency:
  group: monthly-player-info
  cancel-in-progress: false

env:
  API_BASE: https://kbo-api.bstats-baseball.workers.dev
  KBO_DB: /tmp/kbo_players.db

jobs:
  player-info:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install selenium webdriver-manager beautifulsoup4 lxml requests

      - name: 인증 확인
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN 이 없습니다."
            exit 1
          fi
          npx --yes wrangler@4 d1 info kbo-stats > /dev/null

      # players 만 받습니다. play_by_play 는 이 작업에 필요 없고,
      # 받으면 읽기 한도만 크게 씁니다.
      - name: players 내려받기
        id: pull
        run: python migration/d1_to_sqlite.py --out "$KBO_DB" --tables players

      - name: 선수 프로필 수집
        id: scrape
        run: python data_collection/player_info_scraper.py

      - name: players D1 적재
        id: push
        if: steps.scrape.outcome == 'success'
        run: python migration/sqlite_to_d1.py --db "$KBO_DB" --tables players

      - name: 캐시 비우기
        id: purge
        if: steps.push.outcome == 'success'
        env:
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
        run: |
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "ADMIN_TOKEN 이 없어 캐시를 비우지 못합니다."
            exit 1
          fi
          code=$(curl -s -o /tmp/purge.txt -w '%{http_code}' -X POST \
            "$API_BASE/admin/purge-cache" -H "Authorization: Bearer $ADMIN_TOKEN")
          cat /tmp/purge.txt; echo
          test "$code" = "200"

      - name: 결과 기록
        if: always()
        continue-on-error: true
        run: |
          python data_collection/record_job_run.py --job player_info \
            --status ${{ steps.push.outcome == 'success' && 'ok' || 'fail' }} \
            --note "수집 ${{ steps.scrape.outcome }}"

      - name: 로그 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: player-info-logs
          path: logs/
          if-no-files-found: warn
          retention-days: 14

      - name: 요약
        if: always()
        run: |
          {
            echo "## 월간 선수 프로필 재수집"
            echo ""
            echo "| 단계 | 결과 |"
            echo "|---|---|"
            echo "| players 내려받기 | ${{ steps.pull.outcome }} |"
            echo "| 프로필 수집 | ${{ steps.scrape.outcome }} |"
            echo "| D1 적재 | ${{ steps.push.outcome }} |"
            echo "| 캐시 비우기 | ${{ steps.purge.outcome }} |"
          } >> $GITHUB_STEP_SUMMARY
